name: Validate English books

on:
  push:
    branches: ["main"]
    paths:
      - "books/**"
      - "books-manifest.json"
      - "books.html"
      - "literature.html"
      - "literature-works.json"
      - "literature/**"
      - "scripts/validate-books.mjs"
      - "scripts/validate-literature-glossary.mjs"
      - ".github/workflows/validate-books.yml"
  pull_request:
    paths:
      - "books/**"
      - "books-manifest.json"
      - "books.html"
      - "literature.html"
      - "literature-works.json"
      - "literature/**"
      - "scripts/validate-books.mjs"
      - "scripts/validate-literature-glossary.mjs"
      - ".github/workflows/validate-books.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate book data
        run: node scripts/validate-books.mjs
      - name: Validate literature vocabulary
        run: node scripts/validate-literature-glossary.mjs
