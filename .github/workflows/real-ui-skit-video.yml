name: MorningEnglish real UI skit video
on:
  push:
    branches: [video/dev-skit-real-ui-20261126]
    paths: ['.github/workflows/real-ui-skit-video.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser and VOICEVOX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 3; done
          docker logs voicevox
          exit 1
      - name: Record actual MorningEnglish UI
        run: |
          cat > render-real.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs/promises'), path=require('node:path'), cp=require('node:child_process');
          const {performance}=require('node:perf_hooks');
          const run=(args)=>cp.execFileSync('ffmpeg',['-y','-loglevel','error',...args],{stdio:'inherit'});
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const lines=[
            ['index.html','pink','文学版にも寸劇が進出しました！','textRight','bounce'],
            ['index.html','pink2','文学的ですね。あ、猫が来たのだ。','textLeft','shake'],
            ['literature.html','pink','猫にも対応しました！','textRight','hop'],
            ['literature.html','pink2','対応してません！ なんか増えてるのだ。','textLeft','bounce'],
            ['literature.html','pink','次は音声読み上げ。マージしたら、しゃべるはずでした。','textRight','poke'],
            ['literature.html','pink2','口だけ動いて、音が出なかったのだ。','textLeft','shake'],
            ['literature.html','pink','音声テストを追加したら、ついに声が出ました！','textRight','hop'],
            ['index.html','pink2','猫が多すぎて本文が見えないのだ。','textLeft','bounce'],
            ['index.html','pink','明日からも、毎朝、新しい台本で邪魔しに来ます。','textRight','spin'],
            ['index.html','pink2','ところで、英語の勉強はいつするのだ？','textLeft','shake']
          ];
          (async()=>{
            const dir=path.resolve('video-output'),tmp=path.resolve('/tmp/real-skit');
            await fs.mkdir(dir,{recursive:true});await fs.mkdir(tmp,{recursive:true});
            const api='http://127.0.0.1:50021';
            const speakers=await (await fetch(api+'/speakers')).json();
            const id=name=>speakers.find(s=>s.name===name).styles.find(s=>s.name==='ノーマル').id;
            const voices=[id('四国めたん'),id('ずんだもん')];
            const audio=[];
            for(let i=0;i<lines.length;i++){
              const speaker=voices[lines[i][1]==='pink'?0:1],text=lines[i][2];
              let q=await fetch(api+'/audio_query?'+new URLSearchParams({speaker,text}),{method:'POST'});if(!q.ok)throw Error(await q.text());q=await q.json();
              Object.assign(q,{speedScale:1.08,intonationScale:1.12,prePhonemeLength:.12,postPhonemeLength:.18});
              const r=await fetch(api+'/synthesis?'+new URLSearchParams({speaker}),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(q)});if(!r.ok)throw Error(await r.text());
              const file=path.join(tmp,i+'.wav');await fs.writeFile(file,Buffer.from(await r.arrayBuffer()));
              const duration=Number(cp.execFileSync('ffprobe',['-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',file]).toString());
              audio.push({file,duration});
            }
            const browser=await chromium.launch({args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:480,height:854},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            await context.addInitScript(()=>{localStorage.setItem('skit-mode','0');localStorage.setItem('skit-voice','0');localStorage.setItem('pinkchan-visible','1')});
            const page=await context.newPage();page.on('pageerror',e=>console.log('PAGE',e.message));
            // One continuous take on the actual literature page: no resets between lines.
            await page.goto('http://127.0.0.1:8765/literature.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.Skit&&window.Pinkchan&&window.Pinkchan.canvas(),null,{timeout:90000});
            await page.locator('.en-main').first().waitFor({state:'visible',timeout:90000});
            await page.evaluate(async()=>{await Skit.reload();Pinkchan.show();Pinkchan.keepAlive(true)});
            await page.locator('.en-main').first().evaluate(el=>el.scrollIntoView({block:'center',behavior:'instant'}));
            await page.waitForTimeout(500);
            const fps=20, timeline=[];let total=0;
            for(let i=0;i<lines.length;i++){const frames=Math.ceil((audio[i].duration+.25)*fps);timeline.push({start:total,frames,who:lines[i][1],text:lines[i][2],act:lines[i][4],duration:audio[i].duration});total+=frames;}
            total+=fps*2;
            const framesDir=path.join(tmp,'continuous');await fs.mkdir(framesDir);
            await page.evaluate(()=>{Skit.enter('pink',{at:'textRight',scale:1.4});window.__counts={pink:1,cat:0};});
            let nextLine=0, peak=0, catPeak=0;
            // Drive spawn events by frame number rather than by speech or wall clock.
            for(let k=0;k<total;k++){
              const t=k/fps;
              const line=timeline[nextLine];
              if(line&&k===line.start){
                await page.evaluate(l=>{if(!Skit.actors().includes(l.who))Skit.enter(l.who,{at:l.who==='pink'?'textRight':'textLeft',scale:1.35});Skit.play([{who:l.who,say:l.text,act:l.act,dur:l.duration+.23}]);Pinkchan.talk(l.duration);},line);
                nextLine++;
              }
              if(k===Math.round(2.2*fps))await page.evaluate(()=>Skit.enter('cat',{at:'textTop',scale:1.4}));
              if(t>=4&&k%Math.round(.55*fps)===0){
                const counts=await page.evaluate(t=>{
                  const existing=Skit.actors();const add=(base,n)=>{for(let j=0;j<n;j++){let id=2;while(Skit.actors().includes(base+id))id++;Skit.enter(base+id,{at:'screen',scale:.85+Math.random()*.45,tint:base==='pink'?Math.random()*75:0});}};
                  if(existing.length<48){add('pink',t<12?1:2);if(t>5)add('cat',t<12?1:2);}
                  const ids=Skit.actors();return {all:ids.length,cats:ids.filter(x=>x.startsWith('cat')).length};
                },t);peak=Math.max(peak,counts.all);catPeak=Math.max(catPeak,counts.cats);
              }
              if(k===total-fps*2)await page.evaluate(()=>{Skit.exitAll(true);});
              if(k===total-fps)await page.evaluate(()=>{for(let j=0;j<12;j++){Skit.enter('pink'+(j+10),{at:'screen',scale:1});Skit.enter('cat'+(j+10),{at:'screen',scale:1});}});
              await page.screenshot({path:path.join(framesDir,String(k).padStart(5,'0')+'.png'),timeout:15000});
              // Keep browser animations alive while taking frame-indexed screenshots.
              await page.waitForTimeout(12);
            }
            if(peak<20||catPeak<5)throw Error('Insufficient growth: '+peak+'/'+catPeak);
            console.log('Peak actors:',peak,'peak cats:',catPeak);
            const segments=[];
            for(let i=0;i<audio.length;i++){
              const seg=path.join(tmp,'audio-'+i+'.wav');
              run(['-i',audio[i].file,'-af','apad','-t',String(timeline[i].frames/fps),'-ar','48000','-ac','1','-c:a','pcm_s16le',seg]);segments.push(seg);
            }
            const tail=path.join(tmp,'tail.wav');run(['-f','lavfi','-i','anullsrc=r=48000:cl=mono','-t','2','-c:a','pcm_s16le',tail]);segments.push(tail);
            const audioList=path.join(tmp,'audio-list.txt');await fs.writeFile(audioList,segments.map(x=>"file '"+x+"'").join('\n')+'\n');
            const joinedAudio=path.join(tmp,'joined.wav');run(['-f','concat','-safe','0','-i',audioList,'-c','copy',joinedAudio]);
            const video=path.join(tmp,'continuous.mp4');
            run(['-framerate',String(fps),'-i',path.join(framesDir,'%05d.png'),'-i',joinedAudio,'-vf','scale=720:1280:flags=lanczos,setsar=1','-t',String(total/fps),'-c:v','libx264','-preset','fast','-crf','20','-pix_fmt','yuv420p','-c:a','aac','-ar','48000','-ac','1',video]);
            await browser.close();
            const joined=video;
            const credits="VOICEVOX:四国めたん / VOICEVOX:ずんだもん";
            const creditFile=path.join(tmp,'credits.txt');await fs.writeFile(creditFile,credits);
            run(['-i',joined,'-vf',"drawtext=fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc:textfile="+creditFile+":fontsize=19:fontcolor=white:box=1:boxcolor=black@0.72:boxborderw=7:x=(w-tw)/2:y=h-th-18",'-c:v','libx264','-preset','fast','-crf','20','-c:a','copy','-movflags','+faststart',path.join(dir,'MorningEnglish-chaos-20261126.mp4')]);
            console.log(cp.execFileSync('ffprobe',['-v','error','-show_entries','stream=codec_name,width,height:format=duration,size','-of','json',path.join(dir,'MorningEnglish-chaos-20261126.mp4')]).toString());
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/morning-http.log 2>&1 &
          node render-real.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: MorningEnglish-chaos-20261126
          path: video-output/*.mp4
          retention-days: 7
          if-no-files-found: error
