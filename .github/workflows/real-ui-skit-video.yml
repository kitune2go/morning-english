name: MorningEnglish real UI skit video
on:
  push:
    branches: [video/dev-skit-real-ui-20261126]
    paths: ['.github/workflows/real-ui-skit-video.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser and VOICEVOX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 3; done
          docker logs voicevox
          exit 1
      - name: Record actual MorningEnglish UI
        run: |
          cat > render-real.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs/promises'), path=require('node:path'), cp=require('node:child_process');
          const {performance}=require('node:perf_hooks');
          const run=(args)=>cp.execFileSync('ffmpeg',['-y','-loglevel','error',...args],{stdio:'inherit'});
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const lines=[
            ['index.html','pink','今日はMorningEnglishの開発日誌です。','textRight','bounce'],
            ['index.html','pink2','英語を勉強する画面なのに、寸劇を作ってしまったのだ。','textLeft','shake'],
            ['literature.html','pink','文学版にも、寸劇エンジンを接続しました！','textRight','hop'],
            ['literature.html','pink2','これで文学作品の邪魔もできるのだ。','textLeft','bounce'],
            ['literature.html','pink','次は音声読み上げ。マージしたら、しゃべるはずでした。','textRight','poke'],
            ['literature.html','pink2','口だけ動いて、音が出なかったのだ。','textLeft','shake'],
            ['literature.html','pink','音声テストを追加したら、ついに声が出ました！','textRight','hop'],
            ['index.html','pink2','そして今は、ボイスボックスで本物の画面を動画にしているのだ。','textLeft','bounce'],
            ['index.html','pink','明日からも、毎朝、新しい台本で邪魔しに来ます。','textRight','spin'],
            ['index.html','pink2','ところで、英語の勉強はいつするのだ？','textLeft','shake']
          ];
          (async()=>{
            const dir=path.resolve('video-output'),tmp=path.resolve('/tmp/real-skit');
            await fs.mkdir(dir,{recursive:true});await fs.mkdir(tmp,{recursive:true});
            const api='http://127.0.0.1:50021';
            const speakers=await (await fetch(api+'/speakers')).json();
            const id=name=>speakers.find(s=>s.name===name).styles.find(s=>s.name==='ノーマル').id;
            const voices=[id('四国めたん'),id('ずんだもん')];
            const audio=[];
            for(let i=0;i<lines.length;i++){
              const speaker=voices[lines[i][1]==='pink'?0:1],text=lines[i][2];
              let q=await fetch(api+'/audio_query?'+new URLSearchParams({speaker,text}),{method:'POST'});if(!q.ok)throw Error(await q.text());q=await q.json();
              Object.assign(q,{speedScale:1.08,intonationScale:1.12,prePhonemeLength:.12,postPhonemeLength:.18});
              const r=await fetch(api+'/synthesis?'+new URLSearchParams({speaker}),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(q)});if(!r.ok)throw Error(await r.text());
              const file=path.join(tmp,i+'.wav');await fs.writeFile(file,Buffer.from(await r.arrayBuffer()));
              const duration=Number(cp.execFileSync('ffprobe',['-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',file]).toString());
              audio.push({file,duration});
            }
            const browser=await chromium.launch({args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:480,height:854},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            await context.addInitScript(()=>{localStorage.setItem('skit-mode','0');localStorage.setItem('skit-voice','0');localStorage.setItem('pinkchan-visible','1')});
            const page=await context.newPage();page.on('pageerror',e=>console.log('PAGE',e.message));
            let current='',segments=[];
            for(let i=0;i<lines.length;i++){
              const [route,who,text,at,act]=lines[i],{file,duration}=audio[i];
              if(current!==route){
                await page.goto('http://127.0.0.1:8765/'+route,{waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>window.Skit&&window.Pinkchan&&window.Pinkchan.canvas(),{timeout:90000});
                await page.locator(route==='index.html'?'.hero-sentence':'.en-main').first().waitFor({state:'visible',timeout:90000});
                await page.evaluate(async()=>{await window.Skit.reload();window.Pinkchan.show();window.Pinkchan.keepAlive(true)});
                current=route;
              }
              await page.locator(route==='index.html'?'.hero-sentence':'.en-main').first().evaluate(el=>el.scrollIntoView({block:'center'}));
              await page.evaluate(()=>{window.Skit.exitAll(true)});
              await page.waitForTimeout(500);
              await page.evaluate(({who,text,at,act,duration,last})=>{
                window.Skit.enter('pink',{at:'textRight',scale:1.5});
                window.Skit.enter('pink2',{at:'textLeft',scale:1.5,tint:40,flip:true});
                if(last)for(let i=3;i<=10;i++)window.Skit.enter('pink'+i,{at:'screen',scale:.85,tint:i*12});
                window.Skit.play([{who,say:text,act,dur:duration+0.65}]);
              },{who,text,at,act,duration,last:i===lines.length-1});
              await page.locator('.sk-bubble.on').last().waitFor({state:'visible',timeout:10000});
              const fps=12,n=Math.ceil((duration+.55)*fps),frames=path.join(tmp,'frames-'+i);await fs.mkdir(frames);
              const start=performance.now();
              for(let k=0;k<n;k++){
                await wait(Math.max(0,start+k*1000/fps-performance.now()));
                await page.screenshot({path:path.join(frames,String(k).padStart(5,'0')+'.png'),timeout:15000});
              }
              const seg=path.join(tmp,i+'.mp4');
              run(['-framerate',String(fps),'-i',path.join(frames,'%05d.png'),'-i',file,'-vf','scale=720:1280:flags=lanczos,setsar=1','-af','apad','-t',String(n/fps),'-c:v','libx264','-preset','fast','-crf','20','-pix_fmt','yuv420p','-c:a','aac','-ar','48000','-ac','1',seg]);
              segments.push(seg);
              console.log('Captured real UI:',route,i,text);
            }
            await browser.close();
            const list=path.join(tmp,'concat.txt');await fs.writeFile(list,segments.map(x=>"file '"+x+"'").join('\n')+'\n');
            const joined=path.join(tmp,'joined.mp4');run(['-f','concat','-safe','0','-i',list,'-c','copy',joined]);
            const credits="VOICEVOX:四国めたん / VOICEVOX:ずんだもん";
            const creditFile=path.join(tmp,'credits.txt');await fs.writeFile(creditFile,credits);
            run(['-i',joined,'-vf',"drawtext=fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc:textfile="+creditFile+":fontsize=19:fontcolor=white:box=1:boxcolor=black@0.72:boxborderw=7:x=(w-tw)/2:y=h-th-18",'-c:v','libx264','-preset','fast','-crf','20','-c:a','copy','-movflags','+faststart',path.join(dir,'MorningEnglish-real-ui-20261126.mp4')]);
            console.log(cp.execFileSync('ffprobe',['-v','error','-show_entries','stream=codec_name,width,height:format=duration,size','-of','json',path.join(dir,'MorningEnglish-real-ui-20261126.mp4')]).toString());
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/morning-http.log 2>&1 &
          node render-real.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: MorningEnglish-real-ui-20261126
          path: video-output/*.mp4
          retention-days: 7
          if-no-files-found: error
