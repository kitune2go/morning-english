name: Validate English cards

on:
  push:
    branches: ["main"]
    paths:
      - "cards*.json"
      - "index.html"
      - "scripts/build-lazy-indexes.mjs"
      - "card-template.json"
      - "scripts/validate-cards.mjs"
      - ".github/workflows/validate-cards.yml"
  pull_request:
    paths:
      - "cards*.json"
      - "index.html"
      - "scripts/build-lazy-indexes.mjs"
      - "card-template.json"
      - "scripts/validate-cards.mjs"
      - ".github/workflows/validate-cards.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate generated reading indexes and JavaScript
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/build-lazy-indexes.mjs --check
          else
            # Daily automated commits may precede the index-refresh job.
            node scripts/build-lazy-indexes.mjs
          fi
      - name: Validate card JSON
        run: node scripts/validate-cards.mjs
