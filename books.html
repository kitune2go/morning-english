<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263c3c">
<title>英語で本を読む | MorningEnglish Books</title>
<style>
:root{color-scheme:light;--ink:#193332;--muted:#60706b;--paper:#f7f5ef;--card:#fffefb;--line:#d4ddd5;--accent:#a2462e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;line-height:1.75}
.wrap{max-width:820px;margin:auto;padding:24px 16px 80px}
header{border-bottom:2px solid var(--ink);padding-bottom:19px}
.eyebrow{font:700 11px/1.4 ui-monospace,monospace;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
h1,h2,h3{font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;line-height:1.4}
h1{font-size:clamp(27px,5vw,39px);margin:5px 0 7px}
h2{font-size:25px;margin:0 0 4px}
h3{font-size:18px;margin:0 0 8px}
p{margin:0 0 14px}
.lead,.meta,.muted{color:var(--muted);font-size:13px}
.nav,.actions,.tools,.pager{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.nav{margin-top:15px}
a{color:var(--ink)}
.btn,select{font:inherit;font-size:13px;border:1px solid var(--ink);background:white;color:var(--ink);border-radius:6px;padding:8px 12px}
.btn{cursor:pointer;min-height:39px}
.btn:hover{background:#eaf0eb}
.btn.primary{background:var(--ink);color:white}
.btn.primary:hover{background:#355351}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn[aria-pressed=true]{background:#d9eae4}
select{min-width:140px;max-width:100%}
main{padding-top:18px}
.panel,.reader{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:20px;margin:16px 0;box-shadow:0 4px 14px rgba(30,45,40,.045)}
.select-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:13px 0}
.select-row label{font-size:12px;color:var(--muted)}
.select-row select{flex:1;min-width:180px}
progress{width:100%;height:12px;accent-color:#317265}
.progress-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}

.chapter-index{margin:13px 0 10px;background:#f8faf7;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.chapter-index>summary{cursor:pointer;font-size:13px;font-weight:700;padding:3px 0}
.chapter-index>summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.chapter-index-hint{font-size:12px;color:var(--muted);margin:7px 0}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:8px;margin:10px 0 4px}
.chapter-entry{display:flex;align-items:stretch;min-width:0;border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden}
.chapter-entry.current{border-color:#4a8474;box-shadow:0 0 0 1px #4a8474}
.chapter-entry.read{background:#f0f7f2}
.chapter-go{min-width:0;flex:1;background:transparent;color:var(--ink);border:0;padding:9px 10px;text-align:left;cursor:pointer;font:inherit}
.chapter-go:hover{background:#eaf0eb}
.chapter-go:focus-visible,.chapter-read:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.chapter-go-name{display:block;font-size:12px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.chapter-go-state{display:block;color:var(--muted);font-size:11px;line-height:1.5}
.chapter-read{width:78px;flex:0 0 78px;background:#fff;border:0;border-left:1px solid var(--line);color:var(--ink);font-family:inherit;font-weight:700;font-size:12px;line-height:1.4;cursor:pointer}
.chapter-read[aria-pressed=true]{background:#d9eae4;color:#205d4c}
.chapter-read:hover{background:#e2eee6}
.day-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.day-read-status{padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-size:12px}
.day-read-status.read{border-color:#73a68c;background:#e2f1e7;color:#23583e}
@media(max-width:420px){.chapter-grid{grid-template-columns:minmax(0,1fr)}.chapter-read{width:72px;flex-basis:72px}}

.session-label{color:var(--accent);font:700 11px/1.4 ui-monospace,monospace;letter-spacing:.12em}
.summary{font-size:12px;color:var(--muted);margin-bottom:12px}
.paragraph{font:normal clamp(18px,2.8vw,21px)/1.88 Georgia,"Times New Roman",serif;letter-spacing:.008em;margin:0 0 8px}
.text-block{padding:16px 0;border-bottom:1px solid #e1e5df}
.text-block:last-child{border:0}

.paragraph-number{font:700 11px/1.4 ui-monospace,monospace;letter-spacing:.1em;color:var(--accent);margin-bottom:8px}
.text-block.bookmarked{background:#f4faf5;border-left:3px solid #4b8b70;padding-left:12px;padding-right:9px;margin-left:-15px;border-radius:6px}
.paragraph-bookmark{margin-left:8px;border-color:#8cad9c}
.paragraph-bookmark[aria-pressed="true"]{background:#dbeee1;border-color:#4c9474;color:#235942;font-weight:700}
.paragraph-bookmark:focus-visible{outline:2px solid #335f4a;outline-offset:2px}
.resume-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#e7f2e9;border:1px solid #a1c5ad;border-radius:9px;padding:9px 11px;margin:12px 0;color:#245c43;font-size:13px}
.resume-bar[hidden]{display:none}
.resume-bar .btn{min-height:33px;font-size:12px}
.resume-bar strong{flex:1}
.chapter-entry .chapter-go-state .bookmark-note{color:#2c7855;font-weight:700}
.text-block{scroll-margin-top:16px}
@media(max-width:500px){.text-block.bookmarked{margin-left:0;padding-left:9px}.paragraph-bookmark{margin-left:5px}}

.paragraph-help{margin:14px 0 5px;border:1px solid var(--line);background:#f4f7f2;border-radius:9px;padding:10px 12px}
.paragraph-help>summary{font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);padding:3px 0}
.paragraph-help>summary:focus-visible{outline:2px solid var(--accent)}
.paragraph-help>summary .counts{font-size:11px;font-weight:normal;color:var(--muted);margin-left:6px}
.paragraph-help[open]>summary{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.help-intro{font-size:12px;color:var(--muted);margin:7px 0}
.paragraph-summary{font-size:13px;background:#e9f0e9;border-left:3px solid #6e9989;padding:9px 11px;margin:9px 0}
.chunk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.chunk-row:last-child{border-bottom:0}
.chunk-en{font:600 16px/1.55 Georgia,"Times New Roman",serif;white-space:pre-wrap;overflow-wrap:anywhere}
.chunk-role{font-size:11px;color:var(--accent);margin:3px 0}
.chunk-hint{grid-column:1/-1;color:#52645f;font-size:12px;line-height:1.7}

.chunk-hint{font-size:14px;color:#253f39;font-weight:600;padding:8px 10px;border-left:3px solid #6e9989;background:#e8f1eb;border-radius:0 5px 5px 0}
.chunk-lex{grid-column:1/-1;border:1px solid #e0e8e1;border-radius:6px;background:#fffdf8;margin-top:3px;padding:5px 8px}
.chunk-lex summary{cursor:pointer;font-size:12px;color:#43675b;font-weight:700}
.chunk-lex summary:hover{color:#193332}
.chunk-lex[open] summary{padding-bottom:8px;border-bottom:1px solid #e5e9e5;margin-bottom:6px}
.gloss-row{display:grid;grid-template-columns:minmax(80px,1fr) minmax(130px,2fr);gap:6px 10px;border-bottom:1px solid #f0eee8;padding:7px 2px;font-size:12px;line-height:1.6}
.gloss-row:last-child{border-bottom:0}
.gloss-word{font:600 15px/1.5 Georgia,serif;color:#193332;overflow-wrap:anywhere}
.gloss-meaning{color:#273e36}
.gloss-usage{grid-column:2/-1;color:#65746e;font-size:11px;margin-top:-5px}
.chunk-extra{grid-column:1/-1;color:#627169;font-size:11px;line-height:1.7}
@media(max-width:440px){.gloss-row{grid-template-columns:minmax(55px,1fr) minmax(120px,2fr);gap:5px}}

.focus-list{list-style:none;margin:8px 0;padding:0}
.focus-list li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.focus-list li:last-child{border:0}
.focus-en{font:600 15px/1.6 Georgia,serif;margin-right:8px}
.focus-ja{color:var(--muted)}
.paragraph-help h4{font-size:13px;margin:17px 0 6px;border-top:1px solid var(--line);padding-top:9px}
.paragraph-help .word-list{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.paragraph-help .word{background:#fff}
.vocab-note{display:block;font-size:11px;color:#65746e;margin-top:3px}

.paragraph-actions{margin:5px 0 0;text-align:right}

.ask-tools{margin:12px 0 8px;border:1px solid #d7e4de;background:#f3f8f5;padding:12px;border-radius:9px}
.ask-tools>label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#355a50}
.ask-input{display:block;width:100%;padding:10px;border:1px solid #aabbb0;border-radius:6px;background:#fff;font:inherit;font-size:14px;line-height:1.5;color:var(--ink);min-height:41px}
.ask-input:focus{outline:2px solid #61887a;outline-offset:2px}
.ask-buttons{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.ask-buttons .btn{font-size:12px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.ask-help{color:var(--muted);font-size:11px;line-height:1.6;margin:7px 0 0}
.ask-feedback{color:#225b42;font-size:12px;min-height:1.5em;margin:4px 0 0}
@media(max-width:560px){.ask-buttons .btn{flex:1}}

.tiny{font-size:11px;padding:4px 8px;min-height:28px;border-color:var(--line)}
.jp{background:#f0f3ed;border-left:3px solid #6e9989;padding:12px;font-size:14px;line-height:1.85;margin:9px 0}
.section{margin-top:22px}
.section h3{border-bottom:1px solid var(--line);padding-bottom:6px}
.chunks{padding:0;margin:0;list-style:none}
.chunks li{padding:10px 0;border-bottom:1px dashed var(--line)}
.chunk-en{font:600 16px/1.6 Georgia,serif}
.chunk-ja{font-size:13px;color:var(--muted)}
.grammar{margin:8px 0;padding-left:22px;font-size:14px}
.grammar li{margin:6px 0}
.word-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px}
.word{border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.word strong{display:block;font:600 15px Georgia,serif}
.word span{font-size:12px;color:var(--muted)}
.note{background:#f9f1dd;padding:13px;border-radius:8px;font-size:13px}
.pager{justify-content:space-between;margin-top:18px}
.status{padding:13px;border-radius:7px;background:#ecf2ec;font-size:13px}
.error{background:#fceae8;color:#842c21}
.hidden{display:none!important}
footer{margin-top:24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:18px}
@media(max-width:560px){.wrap{padding:15px 12px 60px}.panel,.reader{padding:14px}.pager .btn{flex:1}.actions .btn{flex:1}.paragraph{line-height:1.8}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">MorningEnglish / CEG+ Books</div>
  <h1>英語で本を読む</h1>
  <p class="lead">原文を読み、必要なときだけ訳を開く。1回ずつ読み進める洋書リーダー。</p>
  <nav class="nav" aria-label="関連ページ">
    <a class="btn" href="index.html">← 毎朝の英語</a>
    <a class="btn" href="literature.html">文学読解カード</a>
  </nav>
</header>
<main>
  <div id="status" class="status" role="status">作品を読み込み中です…</div>
  <section class="panel" id="controls" hidden>
    <div class="select-row"><label for="bookSelect">作品</label><select id="bookSelect"></select></div>
    <h2 id="bookTitle"></h2>
    <p class="meta" id="bookMeta"></p>
    <p class="muted" id="bookDescription"></p>
    <div class="select-row"><label for="daySelect">読む回</label><select id="daySelect"></select></div>
    <details id="chapterIndex" class="chapter-index">
      <summary>チャプター一覧・既読管理 <span id="chapterIndexCount" class="muted"></span></summary>
      <p class="chapter-index-hint">章を選ぶと、しおりのある回はその段落へ移動します。右側の「既読」はチャプター全体の読了管理です。</p>
      <div id="chapterList" class="chapter-grid"></div>
    </details>
    <progress id="progress" max="1" value="0" aria-label="読書進捗"></progress>
    <div class="progress-meta"><span id="progressText">0 / 0 回</span><span id="wordStats"></span></div>
    <div class="resume-bar" id="resumeBar" hidden>
      <strong id="resumeLabel">読みかけの位置</strong>
      <button class="btn" id="jumpToResume" type="button">↪ 読みかけの段落へ</button>
    </div>
  </section>
  <article class="reader" id="reader" hidden>
    <div class="session-label" id="dayLabel"></div>
    <div class="day-heading"><h2 id="dayTitle"></h2><span id="dayReadStatus" class="day-read-status">未読</span></div>
    <p class="summary" id="dayMeta"></p>
    <div class="actions">
      <button class="btn" id="toggleJp" type="button" aria-pressed="false">日本語訳を表示</button>
      <button class="btn" id="toggleNotes" type="button" aria-pressed="true">解説を隠す</button>
      <button class="btn" id="readAll" type="button">▶ 英文を読む</button>
      <button class="btn" id="stopAudio" type="button">■ 停止</button>
      <label class="muted" for="rateSelect">速度</label>
      <select id="rateSelect" aria-label="読み上げ速度"><option value="0.70">0.70×</option><option value="0.85" selected>0.85×</option><option value="1">1.00×</option></select>
    </div>
    <div id="textContent" lang="en"></div>
    <section id="notesArea" class="section"></section>
    <div class="pager">
      <button class="btn" id="prevDay" type="button">← 前の回</button>
      <button class="btn primary" id="completeDay" type="button">✓ 読了にする</button>
      <button class="btn" id="nextDay" type="button">次の回 →</button>
    </div>
  </article>
</main>
<footer>
  <p>進捗と表示設定はこの端末のブラウザーに保存します。別端末とは同期されません。</p>
  <p>教材の原文はパブリックドメイン作品を使用。<a id="sourceLink" href="https://www.gutenberg.org/ebooks/902" target="_blank" rel="noopener noreferrer">原文・出典</a>を確認できます。日本語訳・解説は学習用です。</p>
</footer>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const STORAGE_KEY = "morningenglish-books-progress-v1";
let catalog = [], book = null, sessions = [], current = 1, showJp = false, showNotes = true, speechRun = 0;
const askDrafts = new Map();
const safe = (s) => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
function readStore(){
  try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");return v&&typeof v==="object"&&!Array.isArray(v)?v:{};}catch{return {};}
}
function writeStore(data){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}catch{}}
function bookState(){
  const s=readStore()[book.id];
  return s&&typeof s==="object"?{lastDay:Number(s.lastDay)||1,completed:Array.isArray(s.completed)?s.completed:[],paragraphMarks:s.paragraphMarks&&typeof s.paragraphMarks==="object"&&!Array.isArray(s.paragraphMarks)?s.paragraphMarks:{},resume:s.resume&&typeof s.resume==="object"&&!Array.isArray(s.resume)?s.resume:null}:{lastDay:1,completed:[],paragraphMarks:{},resume:null};
}
function updateState(patch){
  const all=readStore(),s=bookState();
  all[book.id]=Object.assign({},s,patch);
  writeStore(all);
}
async function loadJson(path){
  const resp=await fetch(path,{cache:"no-cache"});
  if(!resp.ok)throw new Error("読み込み失敗 ("+resp.status+"): "+path);
  return resp.json();
}
function stopSpeech(){
  speechRun++;
  if("speechSynthesis" in window)window.speechSynthesis.cancel();
}
function speakParagraphs(parts){
  if(!("speechSynthesis" in window)){showStatus("このブラウザでは音声読み上げが利用できません。",true);return;}
  stopSpeech();
  const token=speechRun;
  const phrases=parts.filter(Boolean);
  let index=0;
  function next(){
    if(token!==speechRun||index>=phrases.length)return;
    const u=new SpeechSynthesisUtterance(phrases[index++]);
    u.lang="en-GB";
    u.rate=Number($("rateSelect").value)||0.85;
    u.onend=next;
    u.onerror=()=>{};
    window.speechSynthesis.speak(u);
  }
  setTimeout(next,120);
}
function showStatus(msg,error){
  $("status").textContent=msg;
  $("status").classList.toggle("error",!!error);
  $("status").classList.remove("hidden");
}
function hideStatus(){$("status").classList.add("hidden");}
function validDay(n){return Number.isInteger(n)&&n>=1&&n<=sessions.length;}
function getDay(){return sessions[current-1];}

function validParagraph(day,paragraph){
  return validDay(day)&&Number.isInteger(paragraph)&&paragraph>=1&&paragraph<=sessions[day-1].paragraphs.length;
}
function paragraphMarkFor(day,state=bookState()){
  const mark=Number(state.paragraphMarks?.[day]);
  return validParagraph(day,mark)?mark:null;
}
function resumeMark(state=bookState()){
  const day=Number(state.resume?.day),paragraph=Number(state.resume?.paragraph);
  return validParagraph(day,paragraph)&&paragraphMarkFor(day,state)===paragraph?{day,paragraph}:null;
}
function scrollToParagraph(day,paragraph,behavior="auto"){
  if(!validParagraph(day,paragraph)||current!==day)return false;
  const target=$("reader-paragraph-"+paragraph);
  if(!target)return false;
  target.scrollIntoView({behavior,block:"start"});
  return true;
}
function scheduleParagraphJump(day,paragraph){
  if(!validParagraph(day,paragraph))return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(book&&current===day)scrollToParagraph(day,paragraph);
  }));
}
function syncBookmarkUi(state=bookState()){
  const latest=resumeMark(state);
  $("resumeBar").hidden=!latest;
  $("resumeLabel").textContent=latest?"読みかけ：Day "+String(latest.day).padStart(2,"0")+" ／ 段落 "+latest.paragraph:"";
  const mark=paragraphMarkFor(current,state);
  $("textContent").querySelectorAll("[data-mark-paragraph]").forEach(button=>{
    const paragraph=Number(button.dataset.markParagraph),active=mark===paragraph;
    button.setAttribute("aria-pressed",String(active));
    button.textContent=active?"✓ しおり済み（解除）":"□ ここから再開";
    button.closest(".text-block")?.classList.toggle("bookmarked",active);
  });
}
function toggleParagraphMark(day,paragraph){
  if(!validParagraph(day,paragraph))return;
  const st=bookState(),marks={...st.paragraphMarks};
  const removing=paragraphMarkFor(day,st)===paragraph;
  if(removing)delete marks[day];else marks[day]=paragraph;
  const latest=resumeMark(st);
  const resume=removing?(latest?.day===day?null:st.resume):{day,paragraph};
  updateState({paragraphMarks:marks,resume,lastDay:day});
  const updated=bookState();
  renderChapterIndex(completedDaySet(updated),updated);
  syncBookmarkUi(updated);
}
function jumpToResume(){
  const latest=resumeMark();
  if(!latest)return;
  if(current===latest.day)scrollToParagraph(latest.day,latest.paragraph,"smooth");
  else changeDay(latest.day,latest.paragraph);
}


function completedDaySet(state=bookState()){
  return new Set((Array.isArray(state.completed)?state.completed:[])
    .map(Number).filter(validDay));
}
function toggleChapterRead(day){
  if(!validDay(day))return;
  const completed=completedDaySet();
  if(completed.has(day))completed.delete(day);else completed.add(day);
  updateState({completed:[...completed].sort((a,b)=>a-b)});
  render();
}
function renderChapterIndex(completed,state=bookState()){
  $("daySelect").innerHTML=sessions.map(d=>'<option value="'+d.day+'">'+(completed.has(d.day)?"✓ ":"○ ")+"Day "+String(d.day).padStart(2,"0")+" — "+safe(d.title)+'</option>').join("");
  $("daySelect").value=String(current);
  $("chapterIndexCount").textContent="（"+completed.size+" / "+sessions.length+" 回 既読）";
  $("chapterList").innerHTML=sessions.map(d=>{
    const read=completed.has(d.day),active=d.day===current,day=String(d.day).padStart(2,"0"),mark=paragraphMarkFor(d.day,state);
    return '<div class="chapter-entry'+(read?" read":"")+(active?" current":"")+'">'+
      '<button type="button" class="chapter-go" data-go-day="'+d.day+'"'+(active?' aria-current="page"':"")+' aria-label="Day '+day+" "+safe(d.title)+'を読む">'+
      '<span class="chapter-go-name">'+(read?"✓ ":"○ ")+"Day "+day+" — "+safe(d.title)+'</span>'+
      '<span class="chapter-go-state">'+(active?"閲覧中 · ":"")+(read?"既読":"未読")+' · '+d.wordCount+'語'+(mark?' · <span class="bookmark-note">↪ 段落 '+mark+'から再開</span>':"")+'</span></button>'+
      '<button type="button" class="chapter-read" data-toggle-chapter="'+d.day+'" aria-pressed="'+read+'" aria-label="Day '+day+(read?"の既読を解除":"を既読にする")+'">'+(read?"✓ 既読":"既読にする")+'</button></div>';
  }).join("");
}


function askDraftKey(paragraphIndex){
  return book.id+":"+current+":"+paragraphIndex;
}
function askPrompt(paragraphIndex, question=""){
  const paragraph=getDay().paragraphs[paragraphIndex];
  const place=book.title+"（"+book.author+"） / Day "+current+" / 段落 "+(paragraphIndex+1);
  const userQuestion=String(question||"").trim();
  const request=userQuestion
    ?"質問したいこと：\n"+userQuestion+"\n\nこの質問を最優先して、必要なら語句の意味、構文、語順、文脈、自然な和訳を説明してください。"
    :"この段落の難しい表現や構文を教えてください。特に慣用句、倒置、修飾関係、古い語法があれば取り上げ、自然な日本語訳と短い例文で説明してください。";
  return "英語の原書を読んでいます。以下の作品・箇所について、日本語で説明してください。\n\n"
    +"作品・位置："+place+"\n\n英文：\n"+paragraph+"\n\n"+request
    +"\n\nまず質問への答えを示し、必要な場合だけ補足してください。";
}
function askUrl(paragraphIndex,question=""){
  return "https://chatgpt.com/?prompt="+encodeURIComponent(askPrompt(paragraphIndex,question));
}
async function copyAskPrompt(paragraphIndex,question){
  const content=askPrompt(paragraphIndex,question);
  if(navigator.clipboard?.writeText){
    try{await navigator.clipboard.writeText(content);return true;}catch(e){/* fallback */}
  }
  const temp=document.createElement("textarea");
  temp.value=content;temp.readOnly=true;temp.style.position="fixed";temp.style.left="-9999px";
  document.body.appendChild(temp);temp.select();
  let ok=false;
  try{ok=document.execCommand("copy");}catch(e){ok=false;}
  temp.remove();
  return ok;
}


function splitDialogueChunks(paragraph){
  const count=s=>(s.match(/[\p{L}]+(?:['’\-][\p{L}]+)*/gu)||[]).length;
  const boundary=[...paragraph.matchAll(/[,;:!?](?:["'”])?\s+|\.(?:["'”])?\s+(?=[A-Z])/g)]
    .map(m=>m.index+m[0].length);
  const output=[];
  let from=0;
  while(from<paragraph.length){
    const remaining=paragraph.slice(from);
    if(count(remaining)<=24){output.push(remaining);break;}
    const candidates=boundary.filter(x=>x>from&&count(paragraph.slice(from,x))>=9&&count(paragraph.slice(from,x))<=24);
    let to;
    if(candidates.length)to=candidates.reduce((best,x)=>Math.abs(count(paragraph.slice(from,x))-16)<Math.abs(count(paragraph.slice(from,best))-16)?x:best,candidates[0]);
    else {
      const ws=[...remaining.matchAll(/\S+\s*/g)];
      const token=ws[Math.min(19,ws.length-1)];
      to=from+token.index+token[0].length;
    }
    if(to<=from)throw new Error("チャンク分解に失敗しました");
    output.push(paragraph.slice(from,to));
    from=to;
  }
  if(output.join("")!==paragraph)throw new Error("チャンク分解の原文一致に失敗しました");
  return output;
}
function buildDialogueParagraphDetails(day,glossary){
  const hasTranslation=Array.isArray(day.jp)&&day.jp.length===day.paragraphs.length;
  const tokenRe=/[\p{L}]+(?:['’\-][\p{L}]+)*/gu;
  return day.paragraphs.map((paragraph,pi)=>{
    const parts=splitDialogueChunks(paragraph);
    const speakers={Prom:"プロメテウス",Zeus:"ゼウス",Eros:"エロス",Her:"ヘルメス",Ap:"アポロン",
      Hera:"ヘラ",Par:"パリス",Herm:"ヘルメス",Heph:"ヘパイストス",Ath:"アテナ",
      Asc:"アスクレピオス",Leto:"レト",Sel:"セレネ",Ar:"アレス",Ma:"マイア",
      Hel:"ヘリオス",Aph:"アプロディテ"};
    const wordFor=(word,index,context)=>{
      const spoken=context.match(/^([A-Za-z]+)\.(?:\s|$)/);
      if(index===0&&((spoken&&spoken[1]===word)||(!spoken&&word==="Aph"&&/^Aph Assuredly/.test(context)))&&speakers[word])
        return {word,ja:speakers[word]+"（話者名）",note:"対話の発言者を示す略記。通常の英単語の意味ではありません。"};
      const key=word.toLowerCase().replace(/’/g,"'");
      const entry=glossary.get(key);
      if(!entry)throw new Error("単語訳未登録: "+word);
      return {word,ja:entry.ja,note:entry.note};
    };
    const chunks=parts.map((en,index)=>({
      en,role:index===0?"発言の導入・主題":"発言の続き・意味のまとまり",
      ja:hasTranslation&&parts.length===1
        ?day.jp[pi]
        :hasTranslation?"この部分の個別対訳は未校正です。段落全体の日本語訳を表示してください。"
          :"和訳準備中。各単語の文脈上の意味を確認してください。",
      translationStatus:hasTranslation&&parts.length===1?"complete":"pending",
      hint:"原文を意味のまとまりで分割。話者と修飾語の係り先を確認してください。",
      words:(en.match(tokenRe)||[]).map((word,i)=>wordFor(word,i,en))
    }));
    const allWords=(paragraph.match(tokenRe)||[]).map((word,i)=>wordFor(word,i,paragraph));
    const distinct=[...new Map(allWords.filter(w=>w.word.length>=4).map(w=>[w.word.toLowerCase(),w])).values()];
    const important=(distinct.length?distinct:allWords).slice(0,4);
    const firstChunk=parts[0].trim();
    return {
      summary:(hasTranslation?"段落対訳あり。":"英語原文を先行収録。")+"各チャンクと全単語の語義を照合できます。"+(day.readingPoint||""),
      chunks,
      expressions:[{en:firstChunk,ja:"この段落の導入部分。次の発言との関係を確かめる。"}],
      vocabulary:important.map(x=>({word:x.word,ja:x.ja,note:x.note}))
    };
  });
}

        const wordPanel='<details class="chunk-lex"><summary>このチャンクの全単語（'+fullGloss.length+'語）の意味と用法</summary><div>'+glossary+'</div></details>';
        return '<li class="chunk-row"><div><div class="session-label">CHUNK '+String(j+1).padStart(2,"0")+' / '+detail.chunks.length+'</div><div class="chunk-en" lang="en">'+safe(c.en)+'</div><div class="chunk-role" lang="ja">'+safe(c.role)+'</div></div><button class="btn tiny" data-read-chunk="'+i+':'+j+'" type="button" aria-label="チャンク'+(j+1)+'を英語で読む">▶</button><div class="chunk-hint" lang="ja"><strong>'+(c.translationStatus==='pending'?'翻訳状況：':'日本語訳：')+'</strong>'+safe(c.ja)+'</div>'+wordPanel+(c.hint?'<div class="chunk-extra" lang="ja">構文・読解の補足：'+safe(c.hint)+'</div>':"")+'</li>';

      const expressions=(detail.expressions||[]).map(x=>'<li><span class="focus-en" lang="en">'+safe(x.en)+'</span><span class="focus-ja" lang="ja">'+safe(x.ja)+'</span></li>').join("");
      const vocabulary=(detail.vocabulary||[]).map(x=>'<div class="word"><strong lang="en">'+safe(x.word)+'</strong><span lang="ja">'+safe(x.ja)+'</span><span class="vocab-note" lang="ja">'+safe(x.note||"")+'</span></div>').join("");
      detailsHtml='<details class="paragraph-help" open><summary>段落'+(i+1)+'のチャンク・単語解説<span class="counts">'+detail.chunks.length+'チャンク / '+detail.vocabulary.length+'語</span></summary>'+
        '<p class="help-intro" lang="ja">'+(book.glossaryData?'英文を意味のまとまりに分け、冠詞・前置詞・固有名詞を含む全単語の訳語を原文順に表示します。訳語は辞書の一般語義も含むため、文脈と照合してください。チャンク単位の和訳は未校正の部分があります。':'各チャンクには対応する日本語訳を収録しました。「このチャンクの全単語」を開くと、冠詞・前置詞なども含め、全単語の意味と用法を原文の順番で確認できます。')+'</p>'+
        '<p class="paragraph-summary" lang="ja">'+safe(detail.summary)+'</p>'+
        '<h4>全文チャンク分解・日本語訳・全単語の解説</h4><ol class="chunks">'+chunkHtml+'</ol>'+
        '<h4>重要表現・構文</h4><ul class="focus-list">'+expressions+'</ul>'+
        '<h4>段落内の単語・熟語</h4><div class="word-list">'+vocabulary+'</div></details>';
    }
    const draft=askDrafts.get(askDraftKey(i))||"";
    const queryId="ask-"+safe(book.id)+"-"+current+"-"+i;
    const askBox='<div class="ask-tools">'+
      '<label for="'+queryId+'">この段落をチャッピーに質問する</label>'+
      '<input class="ask-input" type="text" id="'+queryId+'" data-ask-input="'+i+'" maxlength="400" value="'+safe(draft)+'" placeholder="例：for eyes はどんな構文？（未入力でも質問できます）">'+
      '<div class="ask-buttons">'+
      '<a class="btn primary" data-ask-link="'+i+'" href="'+safe(askUrl(i,draft))+'" target="_blank" rel="noopener noreferrer">↗ チャッピーに質問</a>'+
      '<button class="btn" data-ask-copy="'+i+'" type="button">質問文をコピー</button>'+
      '</div>'+
      '<p class="ask-help">作品名・Day・段落番号・英文を自動で含めます。リンク先では内容を確認して送信してください。入力欄に質問を書くと、その内容を優先します。</p>'+
      '<div class="ask-feedback" data-ask-feedback="'+i+'" role="status" aria-live="polite"></div></div>';
    const marked=paragraphMarkFor(current,st)===i+1;
    const bookButton='<button class="btn tiny paragraph-bookmark" data-mark-paragraph="'+(i+1)+'" type="button" aria-pressed="'+marked+'" aria-label="段落'+(i+1)+'を再開位置に'+(marked?'指定済み。解除する':'指定する')+'">'+(marked?'✓ しおり済み（解除）':'□ ここから再開')+'</button>';
    return '<section class="text-block'+(marked?' bookmarked':'')+'" id="reader-paragraph-'+(i+1)+'"><div class="paragraph-number">PARAGRAPH '+String(i+1).padStart(2,"0")+'</div><p class="paragraph" lang="en">'+safe(p)+'</p><div class="paragraph-actions"><button class="btn tiny" data-read-index="'+i+'" type="button" aria-label="段落'+(i+1)+'を英語で読む">▶ この段落</button>'+bookButton+'</div>'+askBox+jp+detailsHtml+"</section>";
  }).join("");
  const chunks=paragraphDetails?"":(data.chunks||[]).length?'<section class="section"><h3>チャンク分解</h3><ul class="chunks">'+data.chunks.map(x=>'<li><div class="chunk-en">'+safe(x.en)+'</div><div class="chunk-ja">'+safe(x.ja)+'</div></li>').join("")+"</ul></section>":"";
  const grammar=(data.grammar||[]).length?'<section class="section"><h3>この回の追加文法ポイント</h3><ol class="grammar">'+data.grammar.map(x=>"<li>"+safe(x)+"</li>").join("")+"</ol></section>":"";
  const words=paragraphDetails?"":(data.vocabulary||[]).length?'<section class="section"><h3>重要語彙</h3><div class="word-list">'+data.vocabulary.map(x=>'<div class="word"><strong>'+safe(x.word)+'</strong><span>'+safe(x.ja)+'</span></div>').join("")+"</div></section>":"";
  const reading=data.readingPoint?'<section class="section"><h3>この回の読解ポイント</h3><div class="note">'+safe(data.readingPoint)+'</div></section>':"";
  const more=translated?"":'<p class="muted section">この回の段落対訳は未登録です。全文チャンク・重要表現・語彙解説は各段落に付いています。</p>';
  $("notesArea").innerHTML=showNotes?chunks+grammar+words+reading+more:"";
  $("notesArea").classList.toggle("hidden",!showNotes);
  syncBookmarkUi(st);

function changeDay(n,paragraph=null){
  if(!validDay(n))return;
  stopSpeech();
  current=n;
  showJp=false;
  updateState({lastDay:n});
  render();
  if(validParagraph(n,paragraph))scheduleParagraphJump(n,paragraph);
  else window.scrollTo({top:0,behavior:"smooth"});
}
async function loadBook(id){
  const chosen=catalog.find(x=>x.id===id);
  if(!chosen)throw new Error("作品が見つかりません");
  stopSpeech();
  showStatus("『"+chosen.title+"』を読み込み中です…");
  const d=await loadJson(chosen.data);
  if(!Array.isArray(d)||d.length===0||!d.every((x,i)=>x.day===i+1&&Array.isArray(x.paragraphs)&&x.paragraphs.length))throw new Error("本文データの形式が不正です");
  if(chosen.glossaryData){
    const lex=await loadJson(chosen.glossaryData);
    if(!Array.isArray(lex))throw new Error("単語辞書の形式が不正です");
    const glossary=new Map(lex.map(x=>[x.word.toLowerCase(),x]));
    d.forEach(day=>{day.paragraphDetails=buildDialogueParagraphDetails(day,glossary);});
  }
  book=chosen;
  sessions=d;
  const saved=bookState(),resume=resumeMark(saved);
  current=resume?resume.day:(validDay(saved.lastDay)?saved.lastDay:1);
  showJp=false;
  $("bookSelect").value=book.id;
  render();
  hideStatus();
  if(resume)scheduleParagraphJump(resume.day,resume.paragraph);
}
async function init(){
  try{
    catalog=await loadJson("books-manifest.json");
    if(!Array.isArray(catalog)||!catalog.length)throw new Error("作品の登録がありません");
    $("bookSelect").innerHTML=catalog.map(x=>'<option value="'+safe(x.id)+'">'+safe(x.title)+"</option>").join("");
    await loadBook(catalog[0].id);
  }catch(e){console.error(e);showStatus("読書データを読み込めませんでした: "+e.message,true);}
}

$("chapterList").addEventListener("click",(event)=>{
  const toggle=event.target.closest("[data-toggle-chapter]");
  if(toggle){toggleChapterRead(Number(toggle.dataset.toggleChapter));return;}
  const target=event.target.closest("[data-go-day]");
  if(target){const day=Number(target.dataset.goDay);changeDay(day,paragraphMarkFor(day));}
});
$("bookSelect").addEventListener("change",async(e)=>{try{await loadBook(e.target.value);}catch(err){showStatus(err.message,true);}});
$("toggleJp").addEventListener("click",()=>{showJp=!showJp;render();});
$("toggleNotes").addEventListener("click",()=>{showNotes=!showNotes;render();});
$("readAll").addEventListener("click",()=>{if(sessions.length)speakParagraphs(getDay().paragraphs);});
$("stopAudio").addEventListener("click",stopSpeech);
$("jumpToResume").addEventListener("click",jumpToResume);
$("textContent").addEventListener("input",(e)=>{
  const input=e.target.closest("[data-ask-input]");
  if(!input)return;
  const i=Number(input.dataset.askInput);
  if(!Number.isInteger(i)||i<0||i>=getDay().paragraphs.length)return;
  askDrafts.set(askDraftKey(i),input.value);
  const link=input.closest(".ask-tools")?.querySelector("[data-ask-link]");
  if(link)link.href=askUrl(i,input.value);
  const feedback=input.closest(".ask-tools")?.querySelector("[data-ask-feedback]");
  if(feedback)feedback.textContent="";
});
$("textContent").addEventListener("click",async(e)=>{
  const mark=e.target.closest("[data-mark-paragraph]");
  if(mark){toggleParagraphMark(current,Number(mark.dataset.markParagraph));return;}
  const copy=e.target.closest("[data-ask-copy]");
  if(copy){
    const i=Number(copy.dataset.askCopy);
    if(!Number.isInteger(i)||i<0||i>=getDay().paragraphs.length)return;
    const area=copy.closest(".ask-tools");
    const question=area?.querySelector("[data-ask-input]")?.value||"";
    const feedback=area?.querySelector("[data-ask-feedback]");
    const result=await copyAskPrompt(i,question);
    if(feedback)feedback.textContent=result?"質問文をコピーしました。ChatGPTに貼り付けて送信できます。":"自動コピーできませんでした。ChatGPTへのリンクをご利用ください。";
    return;
  }
  const link=e.target.closest("[data-ask-link]");
  if(link){
    const i=Number(link.dataset.askLink);
    if(Number.isInteger(i)&&i>=0&&i<getDay().paragraphs.length){
      const q=link.closest(".ask-tools")?.querySelector("[data-ask-input]")?.value||"";
      link.href=askUrl(i,q);
    }
    return;
  }
  const chunk=e.target.closest("[data-read-chunk]");
  if(chunk){
    const [pi,ci]=chunk.dataset.readChunk.split(":").map(Number);
    const item=getDay().paragraphDetails?.[pi]?.chunks?.[ci];
    if(item?.en)speakParagraphs([item.en]);
    return;
  }
  const btn=e.target.closest("[data-read-index]");
  if(!btn)return;
  const p=getDay().paragraphs[Number(btn.dataset.readIndex)];
  if(p)speakParagraphs([p]);
});
$("prevDay").addEventListener("click",()=>changeDay(current-1));
$("nextDay").addEventListener("click",()=>changeDay(current+1));
$("completeDay").addEventListener("click",()=>toggleChapterRead(current));
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopSpeech();});
init();
