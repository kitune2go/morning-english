<html lang="ja">

<title>文学読解カード — CEG+ Literary</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;background:#f5f0df;color:#1c1917;min-height:100vh;background-image:radial-gradient(circle,rgba(28,25,23,.04) 1px,transparent 1px);background-size:20px 20px}.container{max-width:780px;margin:0 auto;padding:24px 16px 80px}header{border-bottom:2px solid #1c1917;padding-bottom:16px;margin-bottom:16px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#78716c}h1{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:30px;margin:4px 0 0}.sub{font-size:12px;color:#57534e;line-height:1.7;margin-top:8px}.nav,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:2px solid #1c1917;background:#fff;color:#1c1917;font-size:10px;text-transform:uppercase;letter-spacing:.12em;text-decoration:none;cursor:pointer;font-family:inherit}.btn.primary{background:#1c1917;color:#f5f0df}.btn:hover{background:#e7e5e4}.btn.primary:hover{background:#44403c}.status{padding:18px;border:2px solid #1c1917;background:#fff;margin:16px 0;font-size:13px;line-height:1.7}.select{border:2px solid #1c1917;background:#fff;padding:8px 10px;font-size:12px;flex:1;min-width:220px}.work-box{border:2px solid #1c1917;background:#fff;padding:14px;margin:16px 0}.work-title{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:20px;font-weight:700}.work-desc{font-size:12px;color:#57534e;line-height:1.7;margin-top:6px}.card{border:2px solid #1c1917;background:#fff;margin:14px 0;padding:18px;box-shadow:4px 4px 0 rgba(28,25,23,.08);scroll-margin-top:18px}.card.bookmarked{border-color:#b91c1c;box-shadow:4px 4px 0 rgba(185,28,28,.16)}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.chapter{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.15em;color:#b91c1c}.title{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:18px;font-weight:700;margin-top:3px}.idbox{display:flex;flex-direction:column;gap:6px;align-items:flex-end}.id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;color:#a8a29e}.bookmark-btn{padding:6px 8px;border-width:1px;font-size:10px;letter-spacing:.08em}.bookmark-btn.active{background:#b91c1c;color:#fff;border-color:#b91c1c}.scene-image-wrap{margin:12px 0 16px;border:2px solid #1c1917;background:#0c0a09}.scene-image{display:block;width:100%;height:auto;max-height:520px;object-fit:cover}.scene-caption{font-size:12px;line-height:1.7;color:#f5f0df;padding:8px 10px;border-top:1px solid rgba(245,240,223,.25)}.image-prompt-box{margin:8px 0 14px;border:1px solid #d6d3d1;background:#fafaf9}.image-prompt-box summary{cursor:pointer;padding:8px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#57534e}.image-prompt-text{padding:0 10px 10px;font-size:12px;line-height:1.7;color:#44403c;white-space:pre-wrap}.jp{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px;line-height:1.8;padding:12px;background:#fafaf9;border-left:4px solid #1c1917;margin:10px 0 14px}.en-main{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.65;font-weight:700;margin:8px 0}.en-sub{font-size:12px;color:#57534e;line-height:1.7;margin:6px 0 12px}.section-title{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:#1c1917;padding:4px 8px;margin:12px 0 8px}.chunk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #e7e5e4}.chunk:last-child{border-bottom:none}.chunk-en{font-family:Georgia,"Times New Roman",serif;font-size:15px}.chunk-ja{font-size:12px;color:#78716c;margin-top:3px}.chunk-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.chunk-btn{padding:5px 7px;border-width:1px;font-size:9px;letter-spacing:.08em}.grammar{margin:0;padding-left:20px;font-size:13px;line-height:1.8}.reading{font-size:13px;line-height:1.8;color:#44403c;padding:12px;background:#fef3c7;border:1px solid #d6d3d1}.keywords{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.kw{font-size:10px;padding:3px 7px;background:#e7e5e4;color:#57534e}.speech-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.speak-btn{border-color:#57534e;background:#fafaf9}.speak-btn.speaking{background:#1c1917;color:#f5f0df;border-color:#1c1917}.footer{text-align:center;margin-top:32px;padding-top:20px;border-top:1px solid #d6d3d1;color:#a8a29e;font-size:11px}@media(max-width:520px){.chunk{grid-template-columns:1fr}.chunk-actions{justify-content:flex-start}.card-head{align-items:flex-start}.idbox{align-items:flex-end}}

.reader-progress{border:2px solid #1c1917;background:#fff;padding:12px 14px;margin:14px 0}
.reader-progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:700}
.reader-progress progress{display:block;width:100%;accent-color:#29684b;height:13px;margin:7px 0}
.reader-progress-hint{font-size:11px;color:#57534e;margin:5px 0}
.chapter-index{margin:12px 0 3px;border:1px solid #a8a29e;background:#fafaf9;padding:8px}
.chapter-index>summary{cursor:pointer;font-size:12px;font-weight:700}
.chapter-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:7px;margin:10px 0 2px}
.chapter-item{display:flex;border:1px solid #a8a29e;background:#fff;min-width:0}
.chapter-item.active{border-color:#047857;box-shadow:0 0 0 1px #047857}
.chapter-item.done{background:#eff9f0}
.chapter-link{padding:8px;flex:1;min-width:0;border:0;background:transparent;color:#1c1917;font:inherit;font-size:12px;text-align:left;cursor:pointer}
.chapter-link strong,.chapter-link small{display:block}
.chapter-link small{font-size:10px;color:#57534e;margin-top:3px}
.chapter-done{border:0;border-left:1px solid #a8a29e;background:#fff;padding:7px;min-width:70px;color:#1c1917;cursor:pointer;font-size:11px}
.chapter-done[aria-pressed="true"]{background:#cce9d1;color:#14532d;font-weight:700}
.chapter-link:focus-visible,.chapter-done:focus-visible{outline:2px solid #047857;outline-offset:-3px}
.read-flag{display:inline-block;font-size:11px;color:#14532d;border:1px solid #86ac92;padding:3px 6px}
.card.read-card{border-left:5px solid #3c8c63}
.read-btn{font-size:10px;padding:6px 8px;border-width:1px;letter-spacing:.05em}
.read-btn[aria-pressed="true"]{background:#d1fae5;color:#065f46;border-color:#065f46}
.card-status-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ask-panel{margin:14px 0;border:1px solid #a8a29e;padding:10px;background:#f8faf9}
.ask-panel>summary{font-size:12px;cursor:pointer;font-weight:700}
.ask-panel label{display:block;font-size:12px;margin:10px 0 5px}
.ask-panel input{padding:9px;width:100%;border:1px solid #78716c;border-radius:3px;font:inherit;font-size:13px}
.ask-panel .toolbar{margin:9px 0 0}
.ask-panel .help{font-size:11px;color:#57534e;margin:8px 0 0;line-height:1.6}
.ask-panel .feedback{font-size:11px;color:#166534;margin:6px 0;min-height:1em}
.chunk-question{font-size:10px;margin-top:7px;padding:4px 7px;border:1px solid #a8a29e;display:inline-block;text-decoration:none;letter-spacing:0;text-transform:none;background:#fff}
@media(max-width:520px){.chapter-list{grid-template-columns:minmax(0,1fr)}.card-status-actions{justify-content:flex-start}.ask-panel .btn{flex:1;justify-content:center}}


/* The word list uses wrapping flex rows rather than intrinsic-width grid tracks.
   Long vocabulary and links must never overlap at narrow Android viewport widths. */
.chunk>div{min-width:0;max-width:100%}
.chunk-en,.chunk-ja{overflow-wrap:anywhere}
.chunk-gloss{margin:9px 0 4px;border:1px solid #d6d3d1;background:#fffdf7;padding:9px;min-width:0;max-width:100%}
.chunk-gloss>summary{cursor:pointer;font-size:12px;color:#254f3c;font-weight:700;line-height:1.6}
.chunk-words{margin-top:8px;min-width:0}
.word-line{padding:10px 0;border-bottom:1px solid #e7e5e4;line-height:1.55;min-width:0;max-width:100%;overflow-wrap:anywhere}
.word-line:last-child{border-bottom:0}
.word-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;min-width:0}
.word-en{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:17px;line-height:1.4;overflow-wrap:anywhere;min-width:0;max-width:100%}
.word-meaning{font-size:13px;color:#292524;line-height:1.6;min-width:0;overflow-wrap:anywhere;flex:1 1 112px}
.word-meaning.unlisted{color:#78716c;font-size:11px;flex:0 1 auto;background:#f1f0ec;border-radius:3px;padding:1px 5px}
.word-usage{font-size:11px;color:#57534e;margin:3px 0 0;line-height:1.6;overflow-wrap:anywhere}
.word-ask{font-family:inherit;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;max-width:100%;font-size:11px;font-weight:600;line-height:1.4;color:#285746!important;background:#fff;border:1px solid #8ba99a;border-radius:4px;text-decoration:none!important;padding:5px 8px;white-space:normal;overflow-wrap:anywhere;cursor:pointer}
.word-ask:hover{background:#e7f1e9}
.word-ask:focus-visible{outline:2px solid #14532d;outline-offset:2px}
.gloss-disclaimer{font-size:11px;line-height:1.7;color:#57534e;margin:5px 0}
.chunk-question{max-width:100%;white-space:normal;overflow-wrap:anywhere;color:#285746!important;text-decoration:none!important;border-radius:4px;font-size:11px;line-height:1.6}
@media(max-width:520px){.chunk-gloss{padding:9px 10px}.word-head{gap:4px 8px}.word-meaning:not(.unlisted){flex-basis:110px}.word-ask{font-size:10px;padding:5px 7px}}
</style>

<body>
<div class="container">
<header>
<div class="label">CEG+ Literary Reading Protocol</div>
<h1>文学読解カード</h1>
<div class="sub">作品ごとに原文を英訳し、チャンク・文法・読解ポイントへ分解するビューです。</div>
<div class="nav"><a class="btn" href="index.html">← 毎朝の英語</a><a class="btn" href="books.html">📘 洋書を読む</a><button class="btn primary" id="reloadBtn">↻ 再読み込み</button><button class="btn" id="stopSpeechBtn">■ 読み上げ停止</button></div>
</header>
<div id="status" class="status">文学カードを読み込み中…</div>
<div id="toolbar" class="toolbar" style="display:none;"><select id="workSelect" class="select"></select><select id="chapterSelect" class="select"></select><button class="btn" id="showAllBtn">全Chapter</button><button class="btn" id="bookmarkJumpBtn">🔖 しおりへ</button><button class="btn" id="bookmarkClearBtn">しおり解除</button></div>
<div id="workInfo" class="work-box" style="display:none;"></div>
<div id="readingProgress" class="reader-progress" style="display:none;">
<div class="reader-progress-head"><span id="progressLabel">読書進捗</span><span id="progressCount">0 / 0 既読</span></div><progress id="readProgressBar" value="0" max="1" aria-label="作品の既読進捗"></progress><div class="reader-progress-hint">Chapterごとに「既読」を付けられます。しおりは読みかけの位置として別に保存します。</div>
<details class="chapter-index" id="chapterIndex"><summary>Chapter一覧・既読管理</summary><div class="chapter-list" id="chapterList"></div></details>
</div>
<div id="content"></div>
<div class="footer">literature-works.json → 作品別manifest → 分割JSONを合流表示します。</div>
</div>
<script>
let works=[],currentWork=null,allCards=[],selectedChapter='all',speakingButton=null,speechTimer=null;
const BOOKMARK_KEY='literature-bookmarks-v1';

const READER_PROGRESS_KEY='literature-chapter-progress-v1';
const askDrafts=new Map();
let wordGlossary=new Map();
async function loadSharedGlossary(){
  try{
    const files=await Promise.all(['books/happy-prince/lexicon.json','books/happy-prince/extended-glossary.json'].map(fetchJson));
    wordGlossary=new Map(files.flat().filter(x=>x&&typeof x.word==='string').map(x=>[x.word.toLowerCase().replace(/’/g,"'"),x]));
  }catch(err){console.warn('共通語彙辞典を読み込めませんでした。単語の質問リンクは利用できます。',err);wordGlossary=new Map();}
}
function readProgressStore(){
  try{const data=JSON.parse(localStorage.getItem(READER_PROGRESS_KEY)||'{}');return data&&typeof data==='object'&&!Array.isArray(data)?data:{};}catch{return {};}
}
function readChapterSet(){
  if(!currentWork)return new Set();
  const saved=readProgressStore()[currentWork.workId];
  const known=new Set(allCards.map(c=>c.id));
  return new Set((Array.isArray(saved?.completed)?saved.completed:[]).filter(id=>known.has(id)));
}
function saveChapterSet(completed){
  if(!currentWork)return;
  const map=readProgressStore();
  map[currentWork.workId]={completed:[...completed]};
  try{localStorage.setItem(READER_PROGRESS_KEY,JSON.stringify(map));}catch(e){console.warn('既読を保存できませんでした',e);}
}
function toggleChapterRead(cardId){
  if(!allCards.some(c=>c.id===cardId))return;
  const completed=readChapterSet();
  if(completed.has(cardId))completed.delete(cardId);else completed.add(cardId);
  saveChapterSet(completed);
  buildChapterSelect();
  renderCards();
}
function renderProgress(){
  const panel=document.getElementById('readingProgress');
  if(!currentWork||!allCards.length){panel.style.display='none';return;}
  panel.style.display='block';
  const completed=readChapterSet(),bm=getBookmarkedCard();
  document.getElementById('progressCount').textContent=completed.size+' / '+allCards.length+' 既読';
  const progress=document.getElementById('readProgressBar');
  progress.max=allCards.length;
  progress.value=completed.size;
  const current=selectedChapter;
  document.getElementById('chapterList').innerHTML=allCards.map(c=>{
    const read=completed.has(c.id),marked=bm?.id===c.id,active=String(current)===String(c.chapter),n=String(c.chapter).padStart(3,'0');
    return '<div class="chapter-item'+(read?' done':'')+(active?' active':'')+'">'+
      '<button type="button" class="chapter-link" data-open-chapter="'+escapeAttr(c.id)+'"'+(active?' aria-current="page"':'')+'>'+
      '<strong>'+(read?'✓ ':'○ ')+'Chapter '+n+' — '+escapeHtml(c.title||'')+'</strong>'+
      '<small>'+(marked?'🔖 読みかけ · ':'')+(read?'既読':'未読')+'</small></button>'+
      '<button class="chapter-done" type="button" data-read-card="'+escapeAttr(c.id)+'" aria-pressed="'+read+'" aria-label="Chapter '+n+(read?'の既読を解除':'を既読にする')+'">'+(read?'✓ 既読':'既読にする')+'</button></div>';
  }).join('');
}
function openChapter(cardId,scroll=true){
  const card=allCards.find(c=>c.id===cardId);if(!card)return;
  selectedChapter=String(card.chapter);
  document.getElementById('chapterSelect').value=selectedChapter;
  renderCards();
  if(scroll)requestAnimationFrame(()=>requestAnimationFrame(()=>scrollToCard(cardId,'auto')));
}
function askPrompt(card,question='',focus=''){
  const position=currentWork.title+' / Chapter '+card.chapter+' / '+(card.title||card.id);
  const topic=String(question||'').trim();
  return '英語読解の学習をしています。以下は日次対話エッセイの英訳です。日本語で解説してください。\n\n'
    +'作品・位置：'+position+'\n\n英文：\n'+(card.translationNatural||card.translationLiteral||'')
    +'\n\n日本語原文：\n'+(card.jp||'')
    +(focus?'\n\n注目する表現：'+focus:'')
    +'\n\n質問：'+(topic||'この英文の慣用句・修飾・語順・語法で難しいところを取り上げ、単語の意味と自然な日本語訳を短い例文付きで教えてください。')
    +'\n\n質問への回答から始めてください。';
}
function askChatUrl(card,question='',focus=''){
  return 'https://chatgpt.com/?prompt='+encodeURIComponent(askPrompt(card,question,focus));
}
async function copyReadingQuestion(card,question){
  const message=askPrompt(card,question);
  try{
    if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(message);return true;}
  }catch(e){}
  const input=document.createElement('textarea');
  input.value=message;input.readOnly=true;input.style.position='fixed';input.style.left='-9999px';document.body.appendChild(input);
  input.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  input.remove();return ok;
}

async function fetchJson(path){const res=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error(path+' を読み込めませんでした');return await res.json();}
function loadBookmarks(){try{return JSON.parse(localStorage.getItem(BOOKMARK_KEY)||'{}');}catch{return {};}}
function saveBookmarks(map){localStorage.setItem(BOOKMARK_KEY,JSON.stringify(map));}
function getBookmarkId(){if(!currentWork)return'';return loadBookmarks()[currentWork.workId]||'';}
function setBookmarkId(cardId){const map=loadBookmarks();if(cardId)map[currentWork.workId]=cardId;else delete map[currentWork.workId];saveBookmarks(map);updateBookmarkToolbar();}
function getBookmarkedCard(){const id=getBookmarkId();return allCards.find(c=>c.id===id)||null;}
async function loadLiterature(){stopSpeech();const status=document.getElementById('status'),content=document.getElementById('content'),toolbar=document.getElementById('toolbar'),workInfo=document.getElementById('workInfo');status.style.display='block';status.textContent='作品リストを読み込み中…';content.innerHTML='';toolbar.style.display='none';workInfo.style.display='none';try{works=await fetchJson('literature-works.json');await loadSharedGlossary();if(!Array.isArray(works)||works.length===0)throw new Error('作品が登録されていません');const savedWorkId=localStorage.getItem('literature-current-work');currentWork=works.find(w=>w.workId===savedWorkId)||works[0];buildWorkSelect();await loadCurrentWork();}catch(err){console.error(err);status.textContent='読み込みエラー: '+err.message;}}
async function loadCurrentWork(){stopSpeech();const status=document.getElementById('status'),toolbar=document.getElementById('toolbar');status.textContent=`『${currentWork.title}』を読み込み中…`;selectedChapter='all';localStorage.setItem('literature-current-work',currentWork.workId);const manifest=await fetchJson(currentWork.manifest);const groups=await Promise.all(manifest.map(file=>fetchJson(file)));allCards=groups.flat().sort((a,b)=>Number(a.chapter)-Number(b.chapter));status.textContent=`『${currentWork.title}』: ${allCards.length}件の文学カードを読み込みました。`;toolbar.style.display='flex';const resume=getBookmarkedCard();if(currentWork.mode==='essay-translation'&&resume)selectedChapter=String(resume.chapter);renderWorkInfo();buildChapterSelect();updateBookmarkToolbar();renderCards();if(currentWork.mode==='essay-translation'&&resume)requestAnimationFrame(()=>requestAnimationFrame(()=>scrollToCard(resume.id,'auto')));}
function buildWorkSelect(){const sel=document.getElementById('workSelect');sel.innerHTML=works.map(w=>`<option value="${escapeHtml(w.workId)}">${escapeHtml(w.title)}</option>`).join('');sel.value=currentWork.workId;}
function buildChapterSelect(){const sel=document.getElementById('chapterSelect'),completed=readChapterSet();sel.innerHTML='<option value="all">全Chapter</option>'+allCards.map(c=>`<option value="${c.chapter}">${completed.has(c.id)?'✓ ':'○ '}Chapter ${String(c.chapter).padStart(3,'0')} — ${escapeHtml(c.title||'')}</option>`).join('');sel.value=selectedChapter;}
function renderWorkInfo(){const box=document.getElementById('workInfo');box.style.display='block';const bm=getBookmarkedCard();box.innerHTML=`<div class="label">CURRENT WORK</div><div class="work-title">${escapeHtml(currentWork.title||'')}</div><div class="work-desc">${escapeHtml(currentWork.description||'')}</div>${bm?`<div class="work-desc">🔖 しおり: ${escapeHtml(bm.id)} — ${escapeHtml(bm.title||'')}</div>`:''}`;}
function updateBookmarkToolbar(){const jump=document.getElementById('bookmarkJumpBtn'),clear=document.getElementById('bookmarkClearBtn');if(!jump||!clear)return;const bm=getBookmarkedCard();jump.disabled=!bm;clear.disabled=!bm;jump.textContent=bm?`🔖 ${bm.id}へ`:'🔖 しおりへ';renderWorkInfo();}
function renderCards(){stopSpeech();const content=document.getElementById('content');const cards=selectedChapter==='all'?allCards:allCards.filter(c=>String(c.chapter)===String(selectedChapter));content.innerHTML=cards.map(renderCard).join('');renderProgress();}
function speakButton(label,text,lang,extraClass=''){return `<button class="btn speak-btn speech-action ${extraClass}" data-label="${escapeAttr(label)}" data-lang="${escapeAttr(lang)}" data-speak-text="${escapeAttr(text)}">▶ ${escapeHtml(label)}</button>`;}

function renderChunk(ch,i,card){
  const en=ch.en||'',ja=ch.ja||'';
  const question='このチャンク内の全単語について、原文の語順で一語ずつ品詞・この文脈での意味・活用を教えてください。';
  const wordLink=askChatUrl(card,question,en);
  const tokens=en.match(/[\p{L}]+(?:['’\-][\p{L}]+)*/gu)||[];
  const words=tokens.map(token=>{
    const info=wordGlossary.get(token.toLowerCase().replace(/’/g,"'"));
    const word=escapeHtml(token);
    if(info){
      return '<div class="word-line"><div class="word-head"><strong class="word-en" lang="en">'+word+'</strong>'+
        '<span class="word-meaning" lang="ja">'+escapeHtml(info.ja)+'</span></div>'+
        (info.note?'<p class="word-usage" lang="ja">'+escapeHtml(info.note)+'</p>':'')+'</div>';
    }
    const link=askChatUrl(card,'次の英単語について、品詞・この文章での意味・語形変化を具体的に説明してください：'+token,en);
    return '<div class="word-line"><div class="word-head"><strong class="word-en" lang="en">'+word+'</strong>'+
      '<span class="word-meaning unlisted" lang="ja">未登録</span>'+
      '<a class="word-ask" href="'+escapeAttr(link)+'" target="_blank" rel="noopener noreferrer" aria-label="'+escapeAttr(token)+'の意味をChatGPTに質問">意味を質問 ↗</a>'+
      '</div></div>';
  }).join('');
  const wordPanel='<details class="chunk-gloss"><summary>全単語（'+tokens.length+'語）の意味・用法</summary>'+
    '<p class="gloss-disclaimer">共通辞典の意味を表示しています。「未登録」は右のボタンから文脈付きで質問できます。</p><div class="chunk-words">'+words+'</div></details>';
  return '<div class="chunk"><div><div class="chunk-en">'+escapeHtml(en)+'</div><div class="chunk-ja">'+escapeHtml(ja)+'</div>'+
    wordPanel+'<a class="chunk-question" href="'+escapeAttr(wordLink)+'" target="_blank" rel="noopener noreferrer">↗ このチャンクの全単語をチャッピーに質問</a></div>'+
    '<div class="chunk-actions">'+speakButton('EN',en,'en-US','chunk-btn')+speakButton('JA',ja,'ja-JP','chunk-btn')+'</div></div>';
}
function renderCard(card){
  const chunks=(card.chunks||[]).map((ch,i)=>renderChunk(ch,i,card)).join('');
  const grammar=(card.grammar||[]).map(g=>'<li>'+escapeHtml(g)+'</li>').join('');
  const keywords=(card.keywords||[]).map(k=>'<span class="kw">'+escapeHtml(k)+'</span>').join('');
  const natural=escapeHtml(card.translationNatural||''),literal=escapeHtml(card.translationLiteral||''),imageBlock=renderImageBlock(card);
  const isBm=getBookmarkId()===card.id,isRead=readChapterSet().has(card.id),id=escapeAttr(card.id||'');
  const draftKey=currentWork.workId+':'+card.id;
  const draft=askDrafts.get(draftKey)||'';
  const askBlock='<details class="ask-panel"><summary>チャッピーにこのChapterの表現を質問</summary>'+
    '<label for="ask-'+id+'">質問したいこと（未入力でも質問できます）</label>'+
    '<input id="ask-'+id+'" type="text" data-ask-input="'+id+'" maxlength="400" value="'+escapeAttr(draft)+'" placeholder="例：この文の while はどんな働き？">'+
    '<div class="toolbar"><a class="btn primary" data-ask-link="'+id+'" href="'+escapeAttr(askChatUrl(card,draft))+'" target="_blank" rel="noopener noreferrer">↗ チャッピーに質問</a>'+
    '<button class="btn" type="button" data-ask-copy="'+id+'">質問文をコピー</button></div>'+
    '<p class="help">作品名・Chapter・英文・日本語原文を含む質問文が開きます。アプリで引き継がれない場合はコピーを使ってください。</p>'+
    '<p class="feedback" data-ask-feedback="'+id+'" aria-live="polite"></p></details>';
  return '<article class="card'+(isBm?' bookmarked':'')+(isRead?' read-card':'')+'" id="card-'+id+'">'+
    '<div class="card-head"><div><div class="chapter">'+escapeHtml(card.sourceTitle||currentWork.title||'')+
    ' · CHAPTER '+String(card.chapter).padStart(3,'0')+(isRead?' · ✓ 既読':'')+'</div><div class="title">'+escapeHtml(card.title||'')+'</div></div>'+
    '<div class="idbox"><div class="id">'+id+'</div><div class="card-status-actions">'+
    '<button class="btn read-btn" type="button" data-read-card="'+id+'" aria-pressed="'+isRead+'">'+(isRead?'✓ 既読（解除）':'○ 既読にする')+'</button>'+
    '<button class="btn bookmark-btn'+(isBm?' active':'')+'" type="button" data-bookmark-card="'+id+'" aria-pressed="'+isBm+'">'+(isBm?'🔖 読みかけ（解除）':'🔖 ここから再開')+'</button></div></div></div>'+
    imageBlock+'<div class="section-title">Original</div><div class="jp">'+escapeHtml(card.jp||'')+'</div>'+
    '<div class="section-title">Natural Translation</div><div class="en-main">'+natural+'</div>'+
    '<div class="speech-row">'+speakButton('英語',card.translationNatural||card.translationLiteral||'','en-US')+
    speakButton('日本語',card.jp||'','ja-JP')+'</div><div class="en-sub">Literal: '+literal+'</div>'+
    askBlock+'<div class="section-title">Chunks</div><div>'+chunks+'</div>'+
    '<div class="section-title">Grammar</div><ol class="grammar">'+grammar+'</ol>'+
    '<div class="section-title">Reading Point</div><div class="reading">'+escapeHtml(card.readingPoint||'')+'</div>'+
    '<div class="keywords">'+keywords+'</div></article>';
}
function toggleBookmark(cardId){if(getBookmarkId()===cardId){setBookmarkId('');}else{setBookmarkId(cardId);}renderCards();setTimeout(()=>scrollToCard(cardId),40);}
function jumpToBookmark(){const bm=getBookmarkedCard();if(!bm)return;openChapter(bm.id);}
function clearBookmark(){setBookmarkId('');renderCards();}
function scrollToCard(cardId,behavior='smooth'){const el=document.getElementById('card-'+cardId);if(el)el.scrollIntoView({behavior,block:'start'});}
function renderImageBlock(card){const imageUrl=card.imageUrl||card.image||'',caption=card.imageCaption||card.caption||'',prompt=card.imagePrompt||'';let html='';if(imageUrl){html+=`<div class="scene-image-wrap"><img class="scene-image" src="${escapeAttr(imageUrl)}" alt="${escapeAttr(caption||card.title||'scene image')}" loading="lazy">`;if(caption)html+=`<div class="scene-caption">${escapeHtml(caption)}</div>`;html+='</div>';}if(prompt){html+=`<details class="image-prompt-box"><summary>Image Prompt</summary><div class="image-prompt-text">${escapeHtml(prompt)}</div></details>`;}return html;}
function speakFromButton(button){speakText(button,button.dataset.speakText||'',button.dataset.lang||'en-US');}
function speakText(button,text,lang){if(!('speechSynthesis'in window)){alert('このブラウザは音声読み上げに対応していません。');return;}const clean=String(text||'').replace(/\s+/g,' ').trim();if(!clean)return;stopSpeech();const utterance=new SpeechSynthesisUtterance(clean);utterance.lang=lang||'en-US';utterance.rate=lang==='ja-JP'?.95:.82;utterance.pitch=1;utterance.onstart=()=>{speakingButton=button;button.classList.add('speaking');button.textContent='■ '+(button.dataset.label||(lang==='ja-JP'?'日本語':'英語'));};utterance.onend=resetSpeakingButton;utterance.onerror=resetSpeakingButton;speechTimer=setTimeout(()=>{speechTimer=null;window.speechSynthesis.speak(utterance);},180);}
function stopSpeech(){if(speechTimer){clearTimeout(speechTimer);speechTimer=null;}if('speechSynthesis'in window)window.speechSynthesis.cancel();resetSpeakingButton();}
function resetSpeakingButton(){if(speakingButton){const label=speakingButton.dataset.label||'再生';speakingButton.classList.remove('speaking');speakingButton.textContent='▶ '+label;speakingButton=null;}}
function escapeHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function escapeAttr(str){return escapeHtml(str).replace(/\n/g,' ');}
document.getElementById('reloadBtn').addEventListener('click',loadLiterature);document.getElementById('stopSpeechBtn').addEventListener('click',stopSpeech);document.getElementById('showAllBtn').addEventListener('click',()=>{selectedChapter='all';document.getElementById('chapterSelect').value='all';renderCards();});document.getElementById('bookmarkJumpBtn').addEventListener('click',jumpToBookmark);document.getElementById('bookmarkClearBtn').addEventListener('click',clearBookmark);document.getElementById('workSelect').addEventListener('change',async e=>{currentWork=works.find(w=>w.workId===e.target.value)||works[0];await loadCurrentWork();});document.getElementById('chapterSelect').addEventListener('change',e=>{selectedChapter=e.target.value;renderCards();});
document.getElementById('chapterList').addEventListener('click',event=>{
  const read=event.target.closest('[data-read-card]');
  if(read){toggleChapterRead(read.dataset.readCard);return;}
  const jump=event.target.closest('[data-open-chapter]');
  if(jump)openChapter(jump.dataset.openChapter);
});
document.getElementById('content').addEventListener('input',event=>{
  const input=event.target.closest('[data-ask-input]');if(!input)return;
  const card=allCards.find(c=>c.id===input.dataset.askInput);if(!card)return;
  askDrafts.set(currentWork.workId+':'+card.id,input.value);
  const panel=input.closest('.ask-panel');
  const link=panel?.querySelector('[data-ask-link]');
  if(link)link.href=askChatUrl(card,input.value);
  const feedback=panel?.querySelector('[data-ask-feedback]');
  if(feedback)feedback.textContent='';
});
document.getElementById('content').addEventListener('click',async event=>{
  const read=event.target.closest('[data-read-card]');
  if(read){toggleChapterRead(read.dataset.readCard);return;}
  const bookmark=event.target.closest('[data-bookmark-card]');
  if(bookmark){toggleBookmark(bookmark.dataset.bookmarkCard);return;}
  const copy=event.target.closest('[data-ask-copy]');
  if(copy){
    const card=allCards.find(c=>c.id===copy.dataset.askCopy);if(!card)return;
    const panel=copy.closest('.ask-panel');
    const question=panel.querySelector('[data-ask-input]').value;
    const result=await copyReadingQuestion(card,question);
    const feedback=panel.querySelector('[data-ask-feedback]');
    if(feedback)feedback.textContent=result?'質問文をコピーしました':'コピーできませんでした。質問リンクをお使いください。';
    return;
  }
  const ask=event.target.closest('[data-ask-link]');
  if(ask){
    const card=allCards.find(c=>c.id===ask.dataset.askLink);
    if(card)ask.href=askChatUrl(card,ask.closest('.ask-panel')?.querySelector('[data-ask-input]')?.value||'');
    return;
  }
  const speak=event.target.closest('.speech-action');
  if(speak){event.preventDefault();speakFromButton(speak);}
});
loadLiterature();
</script>
</body>
</html>
