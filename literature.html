<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<title>文学読解カード — CEG+ Literary</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;background:#f5f0df;color:#1c1917;min-height:100vh;background-image:radial-gradient(circle,rgba(28,25,23,.04) 1px,transparent 1px);background-size:20px 20px}.container{max-width:780px;margin:0 auto;padding:24px 16px 80px}header{border-bottom:2px solid #1c1917;padding-bottom:16px;margin-bottom:16px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#78716c}h1{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:30px;margin:4px 0 0}.sub{font-size:12px;color:#57534e;line-height:1.7;margin-top:8px}.nav,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:2px solid #1c1917;background:#fff;color:#1c1917;font-size:10px;text-transform:uppercase;letter-spacing:.12em;text-decoration:none;cursor:pointer;font-family:inherit}.btn.primary{background:#1c1917;color:#f5f0df}.btn:hover{background:#e7e5e4}.btn.primary:hover{background:#44403c}.status{padding:18px;border:2px solid #1c1917;background:#fff;margin:16px 0;font-size:13px;line-height:1.7}.select{border:2px solid #1c1917;background:#fff;padding:8px 10px;font-size:12px;flex:1;min-width:220px}.work-box{border:2px solid #1c1917;background:#fff;padding:14px;margin:16px 0}.work-title{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:20px;font-weight:700}.work-desc{font-size:12px;color:#57534e;line-height:1.7;margin-top:6px}.card{border:2px solid #1c1917;background:#fff;margin:14px 0;padding:18px;box-shadow:4px 4px 0 rgba(28,25,23,.08);scroll-margin-top:18px}.card.bookmarked{border-color:#b91c1c;box-shadow:4px 4px 0 rgba(185,28,28,.16)}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.chapter{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.15em;color:#b91c1c}.title{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:18px;font-weight:700;margin-top:3px}.idbox{display:flex;flex-direction:column;gap:6px;align-items:flex-end}.id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;color:#a8a29e}.bookmark-btn{padding:6px 8px;border-width:1px;font-size:10px;letter-spacing:.08em}.bookmark-btn.active{background:#b91c1c;color:#fff;border-color:#b91c1c}.scene-image-wrap{margin:12px 0 16px;border:2px solid #1c1917;background:#0c0a09}.scene-image{display:block;width:100%;height:auto;max-height:520px;object-fit:cover}.scene-caption{font-size:12px;line-height:1.7;color:#f5f0df;padding:8px 10px;border-top:1px solid rgba(245,240,223,.25)}.image-prompt-box{margin:8px 0 14px;border:1px solid #d6d3d1;background:#fafaf9}.image-prompt-box summary{cursor:pointer;padding:8px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#57534e}.image-prompt-text{padding:0 10px 10px;font-size:12px;line-height:1.7;color:#44403c;white-space:pre-wrap}.jp{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px;line-height:1.8;padding:12px;background:#fafaf9;border-left:4px solid #1c1917;margin:10px 0 14px}.en-main{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.65;font-weight:700;margin:8px 0}.en-sub{font-size:12px;color:#57534e;line-height:1.7;margin:6px 0 12px}.section-title{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:#1c1917;padding:4px 8px;margin:12px 0 8px}.chunk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #e7e5e4}.chunk:last-child{border-bottom:none}.chunk-en{font-family:Georgia,"Times New Roman",serif;font-size:15px}.chunk-ja{font-size:12px;color:#78716c;margin-top:3px}.chunk-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.chunk-btn{padding:5px 7px;border-width:1px;font-size:9px;letter-spacing:.08em}.grammar{margin:0;padding-left:20px;font-size:13px;line-height:1.8}.reading{font-size:13px;line-height:1.8;color:#44403c;padding:12px;background:#fef3c7;border:1px solid #d6d3d1}.keywords{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.kw{font-size:10px;padding:3px 7px;background:#e7e5e4;color:#57534e}.speech-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.speak-btn{border-color:#57534e;background:#fafaf9}.speak-btn.speaking{background:#1c1917;color:#f5f0df;border-color:#1c1917}.footer{text-align:center;margin-top:32px;padding-top:20px;border-top:1px solid #d6d3d1;color:#a8a29e;font-size:11px}@media(max-width:520px){.chunk{grid-template-columns:1fr}.chunk-actions{justify-content:flex-start}.card-head{align-items:flex-start}.idbox{align-items:flex-end}}

.reader-progress{border:2px solid #1c1917;background:#fff;padding:12px 14px;margin:14px 0}
.reader-progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:700}
.reader-progress progress{display:block;width:100%;accent-color:#29684b;height:13px;margin:7px 0}
.reader-progress-hint{font-size:11px;color:#57534e;margin:5px 0}
.chapter-index{margin:12px 0 3px;border:1px solid #a8a29e;background:#fafaf9;padding:8px}
.chapter-index>summary{cursor:pointer;font-size:12px;font-weight:700}
.chapter-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:7px;margin:10px 0 2px}
.chapter-item{display:flex;border:1px solid #a8a29e;background:#fff;min-width:0}
.chapter-item.active{border-color:#047857;box-shadow:0 0 0 1px #047857}
.chapter-item.done{background:#eff9f0}
.chapter-link{padding:8px;flex:1;min-width:0;border:0;background:transparent;color:#1c1917;font:inherit;font-size:12px;text-align:left;cursor:pointer}
.chapter-link strong,.chapter-link small{display:block}
.chapter-link small{font-size:10px;color:#57534e;margin-top:3px}
.chapter-done{border:0;border-left:1px solid #a8a29e;background:#fff;padding:7px;min-width:70px;color:#1c1917;cursor:pointer;font-size:11px}
.chapter-done[aria-pressed="true"]{background:#cce9d1;color:#14532d;font-weight:700}
.chapter-link:focus-visible,.chapter-done:focus-visible{outline:2px solid #047857;outline-offset:-3px}
.read-flag{display:inline-block;font-size:11px;color:#14532d;border:1px solid #86ac92;padding:3px 6px}
.card.read-card{border-left:5px solid #3c8c63}
.read-btn{font-size:10px;padding:6px 8px;border-width:1px;letter-spacing:.05em}
.read-btn[aria-pressed="true"]{background:#d1fae5;color:#065f46;border-color:#065f46}
.card-status-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ask-panel{margin:14px 0;border:1px solid #a8a29e;padding:10px;background:#f8faf9}
.ask-panel>summary{font-size:12px;cursor:pointer;font-weight:700}
.ask-panel label{display:block;font-size:12px;margin:10px 0 5px}
.ask-panel input{padding:9px;width:100%;border:1px solid #78716c;border-radius:3px;font:inherit;font-size:13px}
.ask-panel .toolbar{margin:9px 0 0}
.ask-panel .help{font-size:11px;color:#57534e;margin:8px 0 0;line-height:1.6}
.ask-panel .feedback{font-size:11px;color:#166534;margin:6px 0;min-height:1em}
.chunk-question{font-size:10px;margin-top:7px;padding:4px 7px;border:1px solid #a8a29e;display:inline-block;text-decoration:none;letter-spacing:0;text-transform:none;background:#fff}
@media(max-width:520px){.chapter-list{grid-template-columns:minmax(0,1fr)}.card-status-actions{justify-content:flex-start}.ask-panel .btn{flex:1;justify-content:center}}

</style>
</head>
<body>
<div class="container">
<header>
<div class="label">CEG+ Literary Reading Protocol</div>
<h1>文学読解カード</h1>
<div class="sub">作品ごとに原文を英訳し、チャンク・文法・読解ポイントへ分解するビューです。</div>
<div class="nav"><a class="btn" href="index.html">← 毎朝の英語</a><a class="btn" href="books.html">📘 洋書を読む</a><button class="btn primary" id="reloadBtn">↻ 再読み込み</button><button class="btn" id="stopSpeechBtn">■ 読み上げ停止</button></div>
</header>
<div id="status" class="status">文学カードを読み込み中…</div>
<div id="toolbar" class="toolbar" style="display:none;"><select id="workSelect" class="select"></select><select id="chapterSelect" class="select"></select><button class="btn" id="showAllBtn">全Chapter</button><button class="btn" id="bookmarkJumpBtn">🔖 しおりへ</button><button class="btn" id="bookmarkClearBtn">しおり解除</button></div>
<div id="workInfo" class="work-box" style="display:none;"></div>
<div id="readingProgress" class="reader-progress" style="display:none;">
<div class="reader-progress-head"><span id="progressLabel">読書進捗</span><span id="progressCount">0 / 0 既読</span></div><progress id="readProgressBar" value="0" max="1" aria-label="作品の既読進捗"></progress><div class="reader-progress-hint">Chapterごとに「既読」を付けられます。しおりは読みかけの位置として別に保存します。</div>
<details class="chapter-index" id="chapterIndex"><summary>Chapter一覧・既読管理</summary><div class="chapter-list" id="chapterList"></div></details>
</div>
<div id="content"></div>
<div class="footer">literature-works.json → 作品別manifest → 分割JSONを合流表示します。</div>
</div>
<script>
let works=[],currentWork=null,allCards=[],selectedChapter='all',speakingButton=null,speechTimer=null;
const BOOKMARK_KEY='literature-bookmarks-v1';
async function fetchJson(path){const res=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error(path+' を読み込めませんでした');return await res.json();}
function loadBookmarks(){try{return JSON.parse(localStorage.getItem(BOOKMARK_KEY)||'{}');}catch{return {};}}
function saveBookmarks(map){localStorage.setItem(BOOKMARK_KEY,JSON.stringify(map));}
function getBookmarkId(){if(!currentWork)return'';return loadBookmarks()[currentWork.workId]||'';}
function setBookmarkId(cardId){const map=loadBookmarks();if(cardId)map[currentWork.workId]=cardId;else delete map[currentWork.workId];saveBookmarks(map);updateBookmarkToolbar();}
function getBookmarkedCard(){const id=getBookmarkId();return allCards.find(c=>c.id===id)||null;}
async function loadLiterature(){stopSpeech();const status=document.getElementById('status'),content=document.getElementById('content'),toolbar=document.getElementById('toolbar'),workInfo=document.getElementById('workInfo');status.style.display='block';status.textContent='作品リストを読み込み中…';content.innerHTML='';toolbar.style.display='none';workInfo.style.display='none';try{works=await fetchJson('literature-works.json');if(!Array.isArray(works)||works.length===0)throw new Error('作品が登録されていません');const savedWorkId=localStorage.getItem('literature-current-work');currentWork=works.find(w=>w.workId===savedWorkId)||works[0];buildWorkSelect();await loadCurrentWork();}catch(err){console.error(err);status.textContent='読み込みエラー: '+err.message;}}
async function loadCurrentWork(){stopSpeech();const status=document.getElementById('status'),toolbar=document.getElementById('toolbar');status.textContent=`『${currentWork.title}』を読み込み中…`;selectedChapter='all';localStorage.setItem('literature-current-work',currentWork.workId);const manifest=await fetchJson(currentWork.manifest);const groups=await Promise.all(manifest.map(file=>fetchJson(file)));allCards=groups.flat().sort((a,b)=>Number(a.chapter)-Number(b.chapter));status.textContent=`『${currentWork.title}』: ${allCards.length}件の文学カードを読み込みました。`;toolbar.style.display='flex';renderWorkInfo();buildChapterSelect();updateBookmarkToolbar();renderCards();}
function buildWorkSelect(){const sel=document.getElementById('workSelect');sel.innerHTML=works.map(w=>`<option value="${escapeHtml(w.workId)}">${escapeHtml(w.title)}</option>`).join('');sel.value=currentWork.workId;}
function buildChapterSelect(){const sel=document.getElementById('chapterSelect');sel.innerHTML='<option value="all">全Chapter</option>'+allCards.map(c=>`<option value="${c.chapter}">Chapter ${String(c.chapter).padStart(3,'0')} — ${escapeHtml(c.title||'')}</option>`).join('');sel.value=selectedChapter;}
function renderWorkInfo(){const box=document.getElementById('workInfo');box.style.display='block';const bm=getBookmarkedCard();box.innerHTML=`<div class="label">CURRENT WORK</div><div class="work-title">${escapeHtml(currentWork.title||'')}</div><div class="work-desc">${escapeHtml(currentWork.description||'')}</div>${bm?`<div class="work-desc">🔖 しおり: ${escapeHtml(bm.id)} — ${escapeHtml(bm.title||'')}</div>`:''}`;}
function updateBookmarkToolbar(){const jump=document.getElementById('bookmarkJumpBtn'),clear=document.getElementById('bookmarkClearBtn');if(!jump||!clear)return;const bm=getBookmarkedCard();jump.disabled=!bm;clear.disabled=!bm;jump.textContent=bm?`🔖 ${bm.id}へ`:'🔖 しおりへ';renderWorkInfo();}
function renderCards(){stopSpeech();const content=document.getElementById('content');const cards=selectedChapter==='all'?allCards:allCards.filter(c=>String(c.chapter)===String(selectedChapter));content.innerHTML=cards.map(renderCard).join('');}
function speakButton(label,text,lang,extraClass=''){return `<button class="btn speak-btn speech-action ${extraClass}" data-label="${escapeAttr(label)}" data-lang="${escapeAttr(lang)}" data-speak-text="${escapeAttr(text)}">▶ ${escapeHtml(label)}</button>`;}
function renderChunk(ch,i){const en=ch.en||'',ja=ch.ja||'';return `<div class="chunk"><div><div class="chunk-en">${escapeHtml(en)}</div><div class="chunk-ja">${escapeHtml(ja)}</div></div><div class="chunk-actions">${speakButton('EN',en,'en-US','chunk-btn')}${speakButton('JA',ja,'ja-JP','chunk-btn')}</div></div>`;}
function renderCard(card){const chunks=(card.chunks||[]).map(renderChunk).join('');const grammar=(card.grammar||[]).map(g=>`<li>${escapeHtml(g)}</li>`).join('');const keywords=(card.keywords||[]).map(k=>`<span class="kw">${escapeHtml(k)}</span>`).join('');const natural=escapeHtml(card.translationNatural||''),literal=escapeHtml(card.translationLiteral||''),imageBlock=renderImageBlock(card);const isBm=getBookmarkId()===card.id;return `<article class="card ${isBm?'bookmarked':''}" id="card-${escapeAttr(card.id||'')}"><div class="card-head"><div><div class="chapter">${escapeHtml(card.sourceTitle||currentWork.title||'')} · CHAPTER ${String(card.chapter).padStart(3,'0')}</div><div class="title">${escapeHtml(card.title||'')}</div></div><div class="idbox"><div class="id">${escapeHtml(card.id||'')}</div><button class="btn bookmark-btn ${isBm?'active':''}" onclick="toggleBookmark('${escapeAttr(card.id||'')}')">${isBm?'🔖 しおり中':'🔖 しおり'}</button></div></div>${imageBlock}<div class="section-title">Original</div><div class="jp">${escapeHtml(card.jp||'')}</div><div class="section-title">Natural Translation</div><div class="en-main">${natural}</div><div class="speech-row">${speakButton('英語',card.translationNatural||card.translationLiteral||'','en-US')}${speakButton('日本語',card.jp||'','ja-JP')}</div><div class="en-sub">Literal: ${literal}</div><div class="section-title">Chunks</div><div>${chunks}</div><div class="section-title">Grammar</div><ol class="grammar">${grammar}</ol><div class="section-title">Reading Point</div><div class="reading">${escapeHtml(card.readingPoint||'')}</div><div class="keywords">${keywords}</div></article>`;}
function toggleBookmark(cardId){if(getBookmarkId()===cardId){setBookmarkId('');}else{setBookmarkId(cardId);}renderCards();setTimeout(()=>scrollToCard(cardId),40);}
function jumpToBookmark(){const bm=getBookmarkedCard();if(!bm)return;selectedChapter='all';document.getElementById('chapterSelect').value='all';renderCards();setTimeout(()=>scrollToCard(bm.id),60);}
function clearBookmark(){setBookmarkId('');renderCards();}
function scrollToCard(cardId){const el=document.getElementById('card-'+cardId);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
function renderImageBlock(card){const imageUrl=card.imageUrl||card.image||'',caption=card.imageCaption||card.caption||'',prompt=card.imagePrompt||'';let html='';if(imageUrl){html+=`<div class="scene-image-wrap"><img class="scene-image" src="${escapeAttr(imageUrl)}" alt="${escapeAttr(caption||card.title||'scene image')}" loading="lazy">`;if(caption)html+=`<div class="scene-caption">${escapeHtml(caption)}</div>`;html+='</div>';}if(prompt){html+=`<details class="image-prompt-box"><summary>Image Prompt</summary><div class="image-prompt-text">${escapeHtml(prompt)}</div></details>`;}return html;}
function speakFromButton(button){speakText(button,button.dataset.speakText||'',button.dataset.lang||'en-US');}
function speakText(button,text,lang){if(!('speechSynthesis'in window)){alert('このブラウザは音声読み上げに対応していません。');return;}const clean=String(text||'').replace(/\s+/g,' ').trim();if(!clean)return;stopSpeech();const utterance=new SpeechSynthesisUtterance(clean);utterance.lang=lang||'en-US';utterance.rate=lang==='ja-JP'?.95:.82;utterance.pitch=1;utterance.onstart=()=>{speakingButton=button;button.classList.add('speaking');button.textContent='■ '+(button.dataset.label||(lang==='ja-JP'?'日本語':'英語'));};utterance.onend=resetSpeakingButton;utterance.onerror=resetSpeakingButton;speechTimer=setTimeout(()=>{speechTimer=null;window.speechSynthesis.speak(utterance);},180);}
function stopSpeech(){if(speechTimer){clearTimeout(speechTimer);speechTimer=null;}if('speechSynthesis'in window)window.speechSynthesis.cancel();resetSpeakingButton();}
function resetSpeakingButton(){if(speakingButton){const label=speakingButton.dataset.label||'再生';speakingButton.classList.remove('speaking');speakingButton.textContent='▶ '+label;speakingButton=null;}}
function escapeHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function escapeAttr(str){return escapeHtml(str).replace(/\n/g,' ');}
document.getElementById('reloadBtn').addEventListener('click',loadLiterature);document.getElementById('stopSpeechBtn').addEventListener('click',stopSpeech);document.getElementById('showAllBtn').addEventListener('click',()=>{selectedChapter='all';document.getElementById('chapterSelect').value='all';renderCards();});document.getElementById('bookmarkJumpBtn').addEventListener('click',jumpToBookmark);document.getElementById('bookmarkClearBtn').addEventListener('click',clearBookmark);document.getElementById('workSelect').addEventListener('change',async e=>{currentWork=works.find(w=>w.workId===e.target.value)||works[0];await loadCurrentWork();});document.getElementById('chapterSelect').addEventListener('change',e=>{selectedChapter=e.target.value;renderCards();});document.getElementById('content').addEventListener('click',e=>{const btn=e.target.closest('.speech-action');if(btn){e.preventDefault();speakFromButton(btn);}});loadLiterature();
</script>
</body>
</html>
