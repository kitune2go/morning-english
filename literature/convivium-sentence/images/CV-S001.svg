<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">CV-S001 終電の二本前</title>
  <desc id="desc">A quiet late-night subway car, two trains before the last, with cold fluorescent lights and a lone narrator standing near the door.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#f8fafc" stop-opacity="0.82"/>
      <stop offset="0.65" stop-color="#f8fafc" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="0" y="500" width="1200" height="175" fill="url(#floor)"/>

  <rect x="70" y="88" width="1060" height="392" rx="18" fill="#262626" stroke="#d6d3d1" stroke-opacity="0.32" stroke-width="3"/>
  <rect x="120" y="135" width="960" height="78" fill="url(#light)" opacity="0.9" filter="url(#softGlow)"/>
  <rect x="150" y="145" width="900" height="22" fill="#f8fafc" opacity="0.62"/>

  <g opacity="0.72">
    <rect x="120" y="250" width="220" height="150" rx="8" fill="#111827" stroke="#e5e7eb" stroke-opacity="0.22"/>
    <rect x="380" y="250" width="220" height="150" rx="8" fill="#111827" stroke="#e5e7eb" stroke-opacity="0.22"/>
    <rect x="640" y="250" width="220" height="150" rx="8" fill="#111827" stroke="#e5e7eb" stroke-opacity="0.22"/>
    <rect x="900" y="250" width="150" height="150" rx="8" fill="#111827" stroke="#e5e7eb" stroke-opacity="0.22"/>
  </g>

  <g opacity="0.95">
    <rect x="118" y="418" width="235" height="38" rx="10" fill="#525252"/>
    <rect x="380" y="418" width="235" height="38" rx="10" fill="#525252"/>
    <rect x="642" y="418" width="235" height="38" rx="10" fill="#525252"/>
    <rect x="904" y="418" width="150" height="38" rx="10" fill="#525252"/>
  </g>

  <g stroke="#d6d3d1" stroke-opacity="0.52" stroke-width="5" fill="none">
    <line x1="116" y1="118" x2="116" y2="514"/>
    <line x1="1084" y1="118" x2="1084" y2="514"/>
    <line x1="110" y1="514" x2="1090" y2="514"/>
    <line x1="570" y1="218" x2="570" y2="514" opacity="0.35"/>
  </g>

  <g transform="translate(990 245)">
    <line x1="0" y1="-80" x2="0" y2="228" stroke="#e7e5e4" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <circle cx="0" cy="-104" r="22" fill="none" stroke="#e7e5e4" stroke-width="5" opacity="0.75"/>
  </g>

  <g transform="translate(1000 410)">
    <ellipse cx="0" cy="210" rx="52" ry="13" fill="#000" opacity="0.35"/>
    <circle cx="0" cy="0" r="34" fill="#1f2937"/>
    <rect x="-28" y="38" width="56" height="110" rx="20" fill="#111827"/>
    <line x1="-24" y1="78" x2="-62" y2="132" stroke="#111827" stroke-width="14" stroke-linecap="round"/>
    <line x1="25" y1="78" x2="48" y2="138" stroke="#111827" stroke-width="14" stroke-linecap="round"/>
    <line x1="-16" y1="148" x2="-28" y2="210" stroke="#111827" stroke-width="16" stroke-linecap="round"/>
    <line x1="18" y1="148" x2="28" y2="210" stroke="#111827" stroke-width="16" stroke-linecap="round"/>
    <rect x="-44" y="125" width="34" height="50" rx="6" fill="#27272a" stroke="#d6d3d1" stroke-opacity="0.2"/>
  </g>

  <g opacity="0.42">
    <line x1="150" y1="560" x2="1030" y2="560" stroke="#f5f5f4" stroke-width="1"/>
    <line x1="210" y1="610" x2="970" y2="610" stroke="#f5f5f4" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="675" x2="520" y2="500" stroke="#f5f5f4" stroke-width="1" opacity="0.2"/>
    <line x1="1120" y1="675" x2="680" y2="500" stroke="#f5f5f4" stroke-width="1" opacity="0.2"/>
  </g>

  <rect x="42" y="38" width="342" height="68" rx="12" fill="#0c0a09" opacity="0.7"/>
  <text x="68" y="72" fill="#f5f0df" font-family="Georgia, serif" font-size="22" letter-spacing="2">Two trains before the last</text>
  <text x="68" y="94" fill="#d6d3d1" font-family="sans-serif" font-size="14" letter-spacing="2">CV-S001 · 終電の二本前</text>
</svg>
