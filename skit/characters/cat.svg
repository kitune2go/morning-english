<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 寸劇用の黒猫（座り姿）。差し替えるときは同じ正方形の枠で描けば config.json はそのまま使える -->
  <style>
    .tail{transform-origin:70px 88px;animation:t 2.2s ease-in-out infinite}
    .ears{transform-origin:46px 30px;animation:e 5s ease-in-out infinite}
    .lid{transform-origin:0 41px;animation:b 4.3s infinite}
    @keyframes t{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
    @keyframes e{0%,90%,100%{transform:none}94%{transform:rotate(-4deg)}}
    @keyframes b{0%,94%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}
  </style>
  <path class="tail" d="M68 88c14 2 24-6 22-18-1-8-8-10-9-6 4 3 4 10-2 14-5 3-11 3-14 3z" fill="#1b1b1f"/>
  <path d="M30 92c-4-14 0-30 10-38h14c10 8 16 22 14 38z" fill="#1b1b1f"/>
  <g class="ears">
    <path d="M28 22l6 18h-10z M64 22l-6 18h10z" fill="#1b1b1f"/>
    <path d="M29 27l3 10h-5z M63 27l-3 10h5z" fill="#4a2a36"/>
  </g>
  <ellipse cx="46" cy="44" rx="22" ry="18" fill="#1b1b1f"/>
  <ellipse cx="38" cy="41" rx="4.2" ry="5" fill="#f4d03f"/>
  <ellipse cx="54" cy="41" rx="4.2" ry="5" fill="#f4d03f"/>
  <ellipse cx="38.6" cy="41.5" rx="1.4" ry="4" fill="#111"/>
  <ellipse cx="54.6" cy="41.5" rx="1.4" ry="4" fill="#111"/>
  <g class="lid" fill="#1b1b1f"><rect x="33" y="35" width="10" height="12"/><rect x="49" y="35" width="10" height="12"/></g>
  <path d="M44 49l2 2 2-2z" fill="#e88aa8"/>
  <path d="M46 51q-2 3-5 2 M46 51q2 3 5 2" stroke="#555" stroke-width="1" fill="none"/>
  <path d="M30 49l-12-2 M30 52l-12 1 M62 49l12-2 M62 52l12 1" stroke="#777" stroke-width=".8"/>
  <path d="M36 90c0-4 3-6 6-6s5 2 5 6 M50 90c0-4 3-6 6-6s5 2 5 6" fill="#26262b"/>
</svg>
